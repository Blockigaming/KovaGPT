[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kovagpt"
version = "0.1.0"
description = "Server-side KovaGPT developer API client"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
classifiers = ["Private :: Do Not Upload"]

[tool.setuptools.packages.find]
include = ["kovagpt"]
