services:
  agent-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports: ["8788:8788"]
    init: true
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "worker/scripts/health-check.mjs"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
