services:
  agent-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env.development
    environment:
      WORKER_CONCURRENCY: 2
      WORKER_POLL_MS: 1000
    ports: ["8788:8788"]
    init: true
    mem_limit: 2g
    tmpfs: ["/tmp/kova-agent:size=512m,uid=1000,gid=1000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "worker/scripts/health-check.mjs"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
