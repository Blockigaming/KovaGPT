name: KovaGPT Final Self-Hosted CI

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character release commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kova-final-self-hosted-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Final exact-SHA validation
    runs-on: [self-hosted, linux, x64, kova-final]
    timeout-minutes: 180
    env:
      CI: "true"
      KOVA_EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Validate requested SHA shape
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KOVA_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          }

      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact checkout and clean source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$KOVA_EXPECTED_RELEASE_SHA"
          test -z "$(git status --porcelain)"
          echo "KOVA_FINAL_CI_SHA=$actual_sha"

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = "24"
          command -v npm >/dev/null
          command -v docker >/dev/null
          docker info >/dev/null

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Install local browser engines
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium firefox webkit

      - name: Run complete source and build gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/local-non-actions-gate.mjs

      - name: Run browser E2E matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e

      - name: Run isolated fresh database rehearsal
        shell: bash
        run: |
          set -euo pipefail
          npm run release:db:isolated

      - name: Run release security and artifact scans
        shell: bash
        run: |
          set -euo pipefail
          npm run release:security
          node scripts/release/artifact-secret-scan.mjs

      - name: Prove final workspace remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$KOVA_EXPECTED_RELEASE_SHA"

      - name: Upload non-secret validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kova-final-self-hosted-${{ inputs.release_sha }}
          path: |
            artifacts/local-non-actions-gate/
            artifacts/release/
          if-no-files-found: warn
          retention-days: 7
