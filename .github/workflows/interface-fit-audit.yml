name: Application Interface Fit

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/interface-fit-audit.yml
      - playwright.interface-fit.config.ts
      - tests/interface-fit/**
      - tests/e2e/core-app-fixture.ts
      - tests/e2e/hydration.ts
      - tests/fixtures/azure-local-network-guard.mjs
      - scripts/azure/local-preview.mjs
      - src/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-fit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Application fit (${{ matrix.browser }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      KOVA_INTERFACE_ENGINE: ${{ matrix.browser }}
      AI_GENERATION_ENABLED: "false"
      KOVA_GENERATION_DISABLED: "true"
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the actual Node application
        run: npm run build:azure
      - name: Install browser and native libraries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          npx --no-install playwright install --with-deps "${{ matrix.browser }}"
      - name: Check every workspace and settings section in both themes
        run: >-
          npx --no-install playwright test --config=playwright.interface-fit.config.ts
          --project="${{ matrix.browser }}-390" --project="${{ matrix.browser }}-1440"
      - name: Record source provenance
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p test-results/interface-fit
          printf '%s\n' "$SOURCE_SHA" > test-results/interface-fit/commit.txt
          git rev-parse 'HEAD^{tree}' > test-results/interface-fit/tree.txt
          sha256sum package-lock.json > test-results/interface-fit/lock.sha256
      - name: Upload screenshots, failures, and exact test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-fit-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/interface-fit/
          if-no-files-found: error
          retention-days: 7
