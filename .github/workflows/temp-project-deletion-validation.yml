name: Temporary Project Deletion Validation

on:
  push:
    branches:
      - codex/project-deletion-integrity-20260904

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/project-deletion-integrity-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and generate
        run: |
          npx prettier --write \
            docs/supabase-storage-contract.md \
            src/integrations/supabase/types.ts \
            src/lib/project-deletion-policy.d.mts \
            src/lib/project-deletion-policy.mjs \
            src/lib/project-deletion.server.ts \
            src/lib/projects.functions.ts \
            src/routes/api/account.ts \
            src/routes/api/project-files.ts \
            'src/routes/projects.$projectId.tsx' \
            src/routes/projects.tsx \
            tests/integration/project-deletion-security-source.test.mjs \
            tests/unit/project-deletion-policy.test.mjs
          npm run release:manifest
          npm run release:schema
          npx prettier --write release-migrations.json database-contract.json
      - name: Commit generated changes
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            database-contract.json \
            docs/supabase-storage-contract.md \
            release-migrations.json \
            src/integrations/supabase/types.ts \
            src/lib/project-deletion-policy.d.mts \
            src/lib/project-deletion-policy.mjs \
            src/lib/project-deletion.server.ts \
            src/lib/projects.functions.ts \
            src/routes/api/account.ts \
            src/routes/api/project-files.ts \
            'src/routes/projects.$projectId.tsx' \
            src/routes/projects.tsx \
            supabase/migrations/20260904210000_project_deletion_storage_integrity.sql \
            tests/integration/project-deletion-security-source.test.mjs \
            tests/unit/project-deletion-policy.test.mjs
          git commit -m "chore(projects): format and refresh deletion contracts"
          git push origin HEAD:codex/project-deletion-integrity-20260904
      - name: Focused deletion tests
        run: >-
          node --test
          tests/unit/project-deletion-policy.test.mjs
          tests/integration/project-deletion-security-source.test.mjs
          tests/integration/project-file-security-source.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - name: Release contracts
        run: |
          npm run release:migrations
          npm run release:migration-preflight
          npm run release:db:references
          npm run release:schema
          git diff --exit-code -- release-migrations.json database-contract.json
