name: Apply exact provider formatting

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/pr-format-artifact.yml"

permissions:
  contents: write

jobs:
  format-and-clean-up:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/lib/ai/provider.server.ts src/lib/ai/provider-transport.server.mjs
      - name: Commit formatting and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git rm .github/workflows/pr-format-artifact.yml
          git add src/lib/ai/provider.server.ts src/lib/ai/provider-transport.server.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply exact provider formatting"
          git push origin "HEAD:${HEAD_BRANCH}"
