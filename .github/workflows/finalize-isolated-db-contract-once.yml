name: Finalize isolated database contract once

on:
  push:
    branches:
      - fix/isolated-db-artifact-directory
    paths:
      - .github/workflows/finalize-isolated-db-contract-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked isolated database repair
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/isolated-db-artifact-directory
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format focused regression test
        run: |
          set -euo pipefail
          npx prettier --write tests/unit/isolated-database-artifact-path.test.mjs
          npx prettier --check tests/unit/isolated-database-artifact-path.test.mjs

      - name: Regenerate and prove deterministic schema contract
        shell: bash
        run: |
          set -euo pipefail
          npm run release:schema
          FIRST_HASH="$(sha256sum database-contract.json | awk '{print $1}')"
          npm run release:schema
          SECOND_HASH="$(sha256sum database-contract.json | awk '{print $1}')"
          test "$FIRST_HASH" = "$SECOND_HASH"
          echo "DATABASE_CONTRACT_SHA256=$SECOND_HASH"

      - name: Run focused regression coverage
        run: node --test tests/unit/isolated-database-artifact-path.test.mjs

      - name: Remove this one-shot workflow
        run: rm .github/workflows/finalize-isolated-db-contract-once.yml

      - name: Commit deterministic outputs
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Finalize isolated database schema contract"
          git push origin HEAD:fix/isolated-db-artifact-directory

# Existing-file retrigger for the one-shot workflow.
