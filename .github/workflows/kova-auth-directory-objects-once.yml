name: Kova Auth Verified Source Objects (once)
on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-directory-objects-once.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload only hash-verified source objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY_SOURCE'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          import zlib

          REPO = 'Blockigaming/KovaGPT'
          BRANCH = 'refs/heads/codex/kova-owned-auth-foundation'
          WORKFLOW = '.github/workflows/kova-auth-directory-objects-once.yml'
          BASE = 'd59182881e9e619a98b766c06fc41fc2ae467679'
          WORKFLOW_PARENT = '98f9afbb90f8ad733ac3831cf4475b69b9b2c421'
          BASE_TREE = 'f887a807f7b1c93ab4a9790c817a8d53a0edb2c6'
          ORIGINAL_TREE = '330ffb1f5974ef803138eb38d5104a3c89ca0f97'
          TARGET_TREE = '66eed2be85fd8e11eaa9a62e1942e7c02701484c'
          MANIFEST_SHA = 'ffe28ab3fa85b6ee4f00ca8ae7997eb8cf6ae390f58df94e8e001f04fb01af97'
          CHUNKS = (
              ('c6b92dee32bf094dd9e37b9298388fa5932cd26f', 5000),
              ('0bfe737135f44fd10b413cac073e841acef05d44', 5000),
              ('04e8718c32a6164b582bd074400adf79e9760162', 5000),
              ('13484942315dabfb886bcf750381f633d9af7a25', 4372),
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('unexpected_api_redirect')

          def api(method, path, body=None):
              if method not in ('GET', 'POST') or not path.startswith('/'):
                  raise RuntimeError('unapproved_operation')
              # This job may create immutable blobs/trees only. Ref and commit writes
              # are deliberately absent; the verified tree is published by the owner tool.
              if method == 'POST' and path not in ('/git/blobs', '/git/trees'):
                  raise RuntimeError('unapproved_write')
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path,
                  data=data, method=method, headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                      payload = response.read(2_000_001)
                      if len(payload) > 2_000_000:
                          raise RuntimeError('api_response_too_large')
                      return json.loads(payload)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('github_http_' + str(error.code)) from None

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def apply_edits(before, edits):
              if not isinstance(edits, list):
                  raise RuntimeError('invalid_edits')
              last = 0
              for edit in edits:
                  if not isinstance(edit, list) or len(edit) != 3:
                      raise RuntimeError('invalid_edit')
                  start, end, replacement = edit
                  if type(start) is not int or type(end) is not int or not last <= start <= end <= len(before) or not isinstance(replacement, str):
                      raise RuntimeError('invalid_edit_bounds')
                  last = end
              for start, end, replacement in reversed(edits):
                  before = before[:start] + replacement.encode('utf-8') + before[end:]
              return before

          def main():
              if os.environ['GITHUB_REPOSITORY'] != REPO or os.environ['GITHUB_REF'] != BRANCH:
                  raise RuntimeError('wrong_repository_or_branch')
              head = os.environ['GITHUB_SHA']
              if len(head) != 40 or any(c not in '0123456789abcdef' for c in head):
                  raise RuntimeError('invalid_head')
              commit = api('GET', '/git/commits/' + head)
              if [p['sha'] for p in commit['parents']] != [WORKFLOW_PARENT]:
                  raise RuntimeError('wrong_parent')
              comparison = api('GET', '/compare/' + BASE + '...' + head)
              if comparison['total_commits'] != 2 or [(f['filename'], f['status']) for f in comparison['files']] != [(WORKFLOW, 'added')]:
                  raise RuntimeError('unexpected_source_change')
              if api('GET', '/git/ref/heads/codex/kova-owned-auth-foundation')['object']['sha'] != head:
                  raise RuntimeError('branch_advanced')
              if api('GET', '/git/commits/' + BASE)['tree']['sha'] != BASE_TREE:
                  raise RuntimeError('wrong_base_tree')
              chunks = []
              for sha, size in CHUNKS:
                  row = api('GET', '/git/blobs/' + sha)
                  if row['encoding'] != 'base64':
                      raise RuntimeError('invalid_chunk_encoding')
                  chunk = base64.b64decode(''.join(row['content'].split()), validate=True)
                  if len(chunk) != size or blob_sha(chunk) != sha:
                      raise RuntimeError('invalid_chunk_hash')
                  chunks.append(chunk)
              packed = base64.b64decode(b''.join(chunks), validate=True)
              decoder = zlib.decompressobj()
              raw = decoder.decompress(packed, 65_537)
              if len(raw) > 65_536 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
                  raise RuntimeError('invalid_manifest_bounds')
              if hashlib.sha256(raw).hexdigest() != MANIFEST_SHA:
                  raise RuntimeError('manifest_hash_mismatch')
              manifest = json.loads(raw)
              if (manifest['base'], manifest['base_tree'], manifest['tree']) != (BASE, BASE_TREE, ORIGINAL_TREE) or len(manifest['files']) != 21:
                  raise RuntimeError('unexpected_manifest')
              follow = api('GET', '/git/blobs/3e043973f92edd9bd28593330af40ccd40d77615')
              follow_raw = base64.b64decode(''.join(follow['content'].split()), validate=True)
              if follow['encoding'] != 'base64' or len(follow_raw) != 1609 or blob_sha(follow_raw) != '3e043973f92edd9bd28593330af40ccd40d77615':
                  raise RuntimeError('follow_up_hash_mismatch')
              follow_up = json.loads(follow_raw)
              if len(follow_up) != 2:
                  raise RuntimeError('unexpected_follow_up')
              manifest['files'].extend(follow_up)
              entries = []
              names = set()
              total = 0
              for item in manifest['files']:
                  path = item['path']
                  if not isinstance(path, str) or path in names or path.startswith('/') or '\\' in path or any(part in ('', '.', '..') for part in path.split('/')):
                      raise RuntimeError('invalid_source_path')
                  if not (path.startswith(('src/', 'tests/', 'supabase/migrations/')) or path in ('.github/workflows/kova-owned-auth-source.yml','database-contract.json','release-migrations.json')):
                      raise RuntimeError('unapproved_source_path')
                  names.add(path)
                  before = b''
                  if item['before'] is not None:
                      old = api('GET', '/git/blobs/' + item['before'])
                      if old['encoding'] != 'base64':
                          raise RuntimeError('invalid_blob_encoding')
                      before = base64.b64decode(''.join(old['content'].split()), validate=True)
                      if blob_sha(before) != item['before']:
                          raise RuntimeError('before_hash_mismatch')
                  after = apply_edits(before, item['edits'])
                  total += len(after)
                  if total > 1_000_000 or blob_sha(after) != item['after']:
                      raise RuntimeError('after_hash_mismatch')
                  result = api('POST', '/git/blobs', {'content': after.decode('utf-8'), 'encoding': 'utf-8'})
                  if result['sha'] != item['after']:
                      raise RuntimeError('published_blob_mismatch')
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':result['sha']})
              result = api('POST', '/git/trees', {'base_tree':BASE_TREE,'tree':entries})
              if result['sha'] != TARGET_TREE:
                  raise RuntimeError('published_tree_mismatch')
              if api('GET', '/git/ref/heads/codex/kova-owned-auth-foundation')['object']['sha'] != head:
                  raise RuntimeError('branch_advanced_after_objects')
              receipt = {'source_base':BASE,'workflow_head':head,'verified_tree':TARGET_TREE,
                         'verified_blobs':len(entries),'branch_updated':False,'deployment':False}
              print(json.dumps(receipt, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('Verified source-object receipt (no ref update)\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')

          if __name__ == '__main__':
              main()
          PY_SOURCE
