name: Kova Auth Verified Source Objects (once)
on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-directory-objects-once.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and upload final review source blobs without ref or tree writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY_SOURCE'
          import base64, hashlib, json, os, urllib.request, urllib.error, zlib
          REPO = 'Blockigaming/KovaGPT'
          BRANCH = 'refs/heads/codex/kova-owned-auth-foundation'
          PARENT = '97791e8e4781359fd827826f5a5b9a9efddd3e76'
          BASE = 'd59182881e9e619a98b766c06fc41fc2ae467679'
          SOURCE_TREE = '66eed2be85fd8e11eaa9a62e1942e7c02701484c'
          FINAL_TREE = '1052e834ef08d1e4b009e4081fface0be998e86e'
          DELTA = 'a96945c749c1e9e0da7b1e354d28d6874826419f'
          SCOPE = 'c46578effbc024833ee7e9ff14e9e3fe2633da02'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('unexpected_redirect')
          def api(method, path, body=None):
              if method not in ('GET', 'POST') or (method == 'POST' and path != '/git/blobs'):
                  raise RuntimeError('unapproved_operation')
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path,
                  method=method, data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json','Content-Type':'application/json',
                      'X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=20) as response:
                      data = response.read(2_000_001)
                      if len(data) > 2_000_000:
                          raise RuntimeError('response_limit')
                      return json.loads(data)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('github_http_' + str(error.code)) from None
          def sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def read_blob(expected):
              row = api('GET', '/git/blobs/' + expected)
              if row['encoding'] != 'base64':
                  raise RuntimeError('blob_encoding')
              data = base64.b64decode(''.join(row['content'].split()), validate=True)
              if sha(data) != expected:
                  raise RuntimeError('blob_hash')
              return data
          def edited(before, item):
              if item['before'] is not None and sha(before) != item['before']:
                  raise RuntimeError('before_hash')
              last = 0
              for start, end, replacement in item['edits']:
                  if type(start) is not int or type(end) is not int or not last <= start <= end <= len(before) or not isinstance(replacement, str):
                      raise RuntimeError('edit_bounds')
                  last = end
              for start, end, replacement in reversed(item['edits']):
                  before = before[:start] + replacement.encode() + before[end:]
              if sha(before) != item['after']:
                  raise RuntimeError('after_hash')
              return before
          if os.environ['GITHUB_REPOSITORY'] != REPO or os.environ['GITHUB_REF'] != BRANCH:
              raise RuntimeError('wrong_scope')
          head = os.environ['GITHUB_SHA']
          if [p['sha'] for p in api('GET', '/git/commits/' + head)['parents']] != [PARENT]:
              raise RuntimeError('wrong_parent')
          comparison = api('GET', '/compare/' + BASE + '...' + head)
          if comparison['total_commits'] != 3 or [(f['filename'],f['status']) for f in comparison['files']] != [('.github/workflows/kova-auth-directory-objects-once.yml','added')]:
              raise RuntimeError('source_advanced')
          if api('GET', '/git/ref/heads/codex/kova-owned-auth-foundation')['object']['sha'] != head:
              raise RuntimeError('branch_advanced')
          packed = read_blob(DELTA)
          if len(packed) != 10548:
              raise RuntimeError('delta_size')
          decoder = zlib.decompressobj()
          raw = decoder.decompress(base64.b64decode(packed, validate=True), 32769)
          if len(raw) != 25511 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or hashlib.sha256(raw).hexdigest() != '950d2c12685c314e6434f33af296ed4d8a776868c9ae86270a7d6d024e6c95e2':
              raise RuntimeError('delta_integrity')
          manifest = json.loads(raw)
          if manifest['base_tree'] != SOURCE_TREE or manifest['tree'] != 'b32d5e075096f81b77c33fb525fac7d2a6a8c4f3' or len(manifest['files']) != 13:
              raise RuntimeError('wrong_manifest')
          results = {}
          for item in manifest['files']:
              path = item['path']
              if path in results or not path.startswith(('src/', 'tests/')) or '\\' in path or any(p in ('', '.', '..') for p in path.split('/')):
                  raise RuntimeError('unapproved_path')
              results[path] = edited(b'' if item['before'] is None else read_blob(item['before']), item)
          scope_raw = read_blob(SCOPE)
          if len(scope_raw) != 398:
              raise RuntimeError('scope_size')
          scope = json.loads(scope_raw)
          if scope['path'] != 'src/lib/kova-auth-http.server.ts':
              raise RuntimeError('scope_path')
          results[scope['path']] = edited(results[scope['path']], scope)
          if sum(map(len, results.values())) > 200000:
              raise RuntimeError('source_limit')
          entries = []
          for path, data in results.items():
              result = api('POST', '/git/blobs', {'encoding':'utf-8','content':data.decode('utf-8')})
              if result['sha'] != sha(data):
                  raise RuntimeError('uploaded_hash_mismatch')
              entries.append({'path':path,'sha':result['sha'],'mode':'100644','type':'blob'})
          print(json.dumps({'verified_blobs':entries,'base_tree':SOURCE_TREE,'expected_final_tree':FINAL_TREE,'ref_updated':False,'tree_written':False}, sort_keys=True))
          PY_SOURCE
