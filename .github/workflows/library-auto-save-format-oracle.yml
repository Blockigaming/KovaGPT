name: Library auto-save formatter oracle

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'codex/library-auto-save-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print locked Prettier output
        shell: bash
        run: |
          files="src/hooks/use-library-attachment-auto-save.ts src/lib/library-images.functions.ts src/lib/library.functions.ts src/routes/images.tsx tests/integration/library-auto-save-source.test.mjs"
          npx prettier --write $files
          for file in $files; do
            echo "FORMAT_ORACLE_BEGIN:$file"
            base64 -w 0 "$file"
            echo
            echo "FORMAT_ORACLE_END:$file"
          done
