name: Format Azure staging template once

on:
  push:
    branches:
      - infra/azure-low-cost-staging
    paths:
      - .github/workflows/finalize-azure-staging-template-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out infrastructure branch
        uses: actions/checkout@v4
        with:
          ref: infra/azure-low-cost-staging
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format repository-supported files
        run: >-
          npx prettier --write
          docs/azure-staging-deployment.md
          infra/azure/staging/main.parameters.example.json
          scripts/azure/validate-staging-template.mjs
          tests/unit/azure-staging-template.test.mjs

      - name: Run secret-free structural validation
        run: |
          set -euo pipefail
          node scripts/azure/validate-staging-template.mjs
          node --test tests/unit/azure-staging-template.test.mjs

      - name: Remove this one-shot workflow
        run: rm .github/workflows/finalize-azure-staging-template-once.yml

      - name: Commit deterministic formatting
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Format and validate low-cost Azure staging template"
          git push origin HEAD:infra/azure-low-cost-staging
