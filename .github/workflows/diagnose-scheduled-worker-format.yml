name: Diagnose scheduler worker formatting
on:
  pull_request:
    paths:
      - scripts/scheduled-tasks/production-worker.mjs
      - tests/unit/scheduled-task-production-invoker.test.mjs
      - .github/workflows/diagnose-scheduled-worker-format.yml
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show expected formatting changes
        run: |
          npx prettier --write scripts/scheduled-tasks/production-worker.mjs tests/unit/scheduled-task-production-invoker.test.mjs
          git diff -- scripts/scheduled-tasks/production-worker.mjs tests/unit/scheduled-task-production-invoker.test.mjs
