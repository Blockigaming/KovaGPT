name: PR653 auth visual baseline reconciliation

on:
  push:
    branches: [fix/requalify-pr648-20261111]
    paths:
      - .github/workflows/pr653-auth-visual-rebaseline.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble@sha256:35246d87a7c88ea9b771c65d33171b2611b02a8253b4b12ce6f94376c55f99f2
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      AI_GENERATION_ENABLED: "false"
      KOVA_GENERATION_DISABLED: "true"
    steps:
      - name: Checkout exact branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm native Chromium runtime
        run: |
          set -euo pipefail
          test "${PLAYWRIGHT_BROWSERS_PATH:-}" = "/ms-playwright"
          npx --no-install playwright install chromium
          node scripts/ci/assert-playwright-native-runtime.mjs chromium
      - name: Refresh only the reviewed guest-auth dialog baselines
        run: |
          set -euo pipefail
          npx --no-install playwright test --config=playwright.auth-visual.config.ts --update-snapshots
          python3 - <<'PY'
          import subprocess
          expected = {
              "tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-desktop-1440x900-linux.png",
              "tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-phone-390x844-linux.png",
          }
          changed = set(filter(None, subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()))
          if changed != expected:
              raise SystemExit(f"Unexpected snapshot changes: {sorted(changed)}; expected: {sorted(expected)}")
          PY
      - name: Re-run strict screenshots without updating expectations
        run: npx --no-install playwright test --config=playwright.auth-visual.config.ts
      - name: Preserve reviewed screenshots as evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr653-auth-baselines-${{ github.sha }}
          path: |
            tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-desktop-1440x900-linux.png
            tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-phone-390x844-linux.png
          if-no-files-found: error
          retention-days: 7
      - name: Commit only accepted visual baselines to the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/requalify-pr648-20261111"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-desktop-1440x900-linux.png
          git add tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-phone-390x844-linux.png
          git commit -m "test(visual): align auth baselines with reviewed pinned Chromium"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/fix/requalify-pr648-20261111"
