name: PR595 format correction
on:
  push:
    branches:
      - fix/home-start-at-bottom-hide-work-20261106
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Format, commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD | xargs -0 -r ./node_modules/.bin/prettier --write --ignore-unknown
          git rm .github/workflows/pr595-reformat-final.yml
          git add -u
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format hosted voice receipt test'
          git push origin HEAD:fix/home-start-at-bottom-hide-work-20261106
