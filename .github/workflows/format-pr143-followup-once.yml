name: Format PR 143 follow-up once

on:
  push:
    branches:
      - program/azure-gpt56-foundation
    paths:
      - .github/workflows/format-pr143-followup-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: program/azure-gpt56-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format follow-up files
        run: >-
          npx prettier --write
          scripts/security/scan-ai-runtime.mjs
          src/lib/ai/model-router.mjs
          tests/unit/azure-gpt56-foundation.test.mjs

      - name: Run focused tests and zero-Lovable scan
        run: |
          set -euo pipefail
          node --test tests/unit/azure-gpt56-foundation.test.mjs
          node scripts/security/scan-ai-runtime.mjs

      - name: Remove this one-shot workflow
        run: rm .github/workflows/format-pr143-followup-once.yml

      - name: Commit deterministic formatting
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Format and verify GPT-5.6 routing follow-up"
          git push origin HEAD:program/azure-gpt56-foundation
