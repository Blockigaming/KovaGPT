name: Verify live PR560 mobile public UI read-only

on:
  push:
    branches: [verify/pr560-live-mobile-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the actual public production mobile UI
        env:
          KOVA_PRODUCTION_URL: https://kovagpt.com
        run: npx playwright test --config=playwright.pr560-live-mobile.config.ts --reporter=list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr560-live-mobile-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
