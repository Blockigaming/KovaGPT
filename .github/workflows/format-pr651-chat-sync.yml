name: Format PR 651 chat sync layout
on:
  push:
    paths:
      - .github/workflows/format-pr651-chat-sync.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/specific-page-link-preview-20261110
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/components/ChatHistorySync.tsx
      - name: Commit formatted chat sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChatHistorySync.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format compact chat sync migration row"
            git push origin HEAD:feature/specific-page-link-preview-20261110
          fi
