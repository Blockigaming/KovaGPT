name: Global search formatter oracle

on:
  push:
    branches:
      - codex/global-search-keyboard-20260904

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/CommandPalette.tsx src/routes/index.tsx tests/e2e/mobile-shell-ui-truth.spec.ts tests/e2e/product-completeness.spec.ts tests/integration/global-search-keyboard-source.test.mjs
      - name: Print formatted sources
        shell: bash
        run: |
          for file in src/components/CommandPalette.tsx src/routes/index.tsx tests/e2e/mobile-shell-ui-truth.spec.ts tests/e2e/product-completeness.spec.ts tests/integration/global-search-keyboard-source.test.mjs; do
            echo "FORMAT_START:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
