name: PR649 one-shot reviewed auth screenshot baseline sync

on:
  push:
    branches:
      - feature/finances-dashboard-preview-20261110
    paths:
      - .github/workflows/pr649-reviewed-auth-snapshot-sync.yml

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch with two commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/finances-dashboard-preview-20261110
          fetch-depth: 2
          persist-credentials: true
      - name: Import reviewed exact screenshots from pinned Playwright 1.56.0 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Blockigaming/KovaGPT"
          test "$GITHUB_REF" = "refs/heads/feature/finances-dashboard-preview-20261110"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "096166bc1c839dc4dae6ac86b80d42ac19ba91ac"
          test "$(git rev-parse HEAD:src/components/auth/AuthDialog.tsx)" = "2b9ad0fd4d5c2a882e6a4866568e4422bf77faa6"
          test "$(git rev-parse HEAD:tests/e2e/auth-visual-regression.spec.ts)" = "03d6129e9a73b688f7b2c979fe3798b18e902277"
          dest="tests/e2e/auth-visual-regression.spec.ts-snapshots"
          mkdir -p "$dest"
          archive="$RUNNER_TEMP/pr649-auth-screenshots-reviewed.zip"
          curl --fail --show-error --silent --location --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Blockigaming/KovaGPT/actions/artifacts/13874648901/zip' \
            --output "$archive"
          for project in desktop-1440x900 phone-390x844; do
            src="test-results/assistant-auth-visual/results/auth-visual-regression-guest-auth-dialog-visual-baseline-${project}/guest-auth-dialog-actual.png"
            unzip -p "$archive" "$src" > "$dest/guest-auth-dialog-${project}-linux.png"
          done
          echo '366eb557f11a4aef5c156466acbfe2ccb5aa9d9b2b6d21709ab44de50e0a5416  tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-desktop-1440x900-linux.png' | sha256sum --check --status
          echo 'e16ee1d94432dd4067d7da031501fe6b679756fe0b0263714789a00a360c6674  tests/e2e/auth-visual-regression.spec.ts-snapshots/guest-auth-dialog-phone-390x844-linux.png' | sha256sum --check --status
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          root = Path('tests/e2e/auth-visual-regression.spec.ts-snapshots')
          for variant, expected in [('desktop-1440x900', (1440, 900)), ('phone-390x844', (390, 844))]:
              image = (root / f'guest-auth-dialog-{variant}-linux.png').read_bytes()
              assert image[:8] == b'\x89PNG\r\n\x1a\n', variant
              assert unpack('>II', image[16:24]) == expected, variant
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$dest/guest-auth-dialog-desktop-1440x900-linux.png" "$dest/guest-auth-dialog-phone-390x844-linux.png"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Tests: pin reviewed auth screenshot baselines to Playwright 1.56.0 container'
          git push origin HEAD:feature/finances-dashboard-preview-20261110
