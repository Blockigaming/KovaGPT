name: Temporary Part 1 code-based verification
on:
  push:
    branches: [codex/device-qa-code-744]
permissions:
  contents: read
jobs:
  layouts:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 15
    env:
      HOME: /root
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the exact draft 744 web application
        run: KOVA_BUILD_SHA=778416f80eb02e5f94ddd2d6010a43aefed31546 npm run build:azure
      - name: Verify the installed browsers
        run: bash scripts/ci/install-playwright-browsers.sh chromium webkit
      - name: Test viewport transitions, large text, and WebKit storage
        run: npx --no-install playwright test --config=playwright.qa-part1-proof.config.ts
