name: Android Health Connect build
on:
  pull_request:
    paths:
      - "android/**"
      - "src/health/use-apple-health-live.ts"
      - "src/components/AppleHealthReport.tsx"
      - "src/components/HealthConnectionsPanel.tsx"
      - "tests/browser-runtime/finance-health-connections.spec.ts"
      - ".github/workflows/android-health.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: 8.11.1
      - name: Build and check the Android companion
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          gradle -p android --no-daemon :app:lintDebug :app:assembleDebug
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/ci/install-playwright-browsers.sh chromium
      - name: Verify Apple and Android health permission handling in the dashboard
        run: >-
          npx --no-install playwright test tests/browser-runtime/finance-health-connections.spec.ts
          --config=playwright.browser.config.ts --project=chromium
          --grep 'native Apple Health|Android Health Connect'
