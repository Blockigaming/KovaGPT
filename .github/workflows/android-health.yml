name: Android Health Connect build
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-health.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: 8.11.1
      - name: Build and check the Android companion
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          gradle -p android --no-daemon :app:lintDebug :app:assembleDebug
