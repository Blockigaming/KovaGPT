name: Format PR 651 candidate
on:
  push:
    branches:
      - feature/specific-page-link-preview-20261110
    paths:
      - .github/workflows/format-pr651-candidate.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/specific-page-link-preview-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format candidate and inherited workflow
        run: |
          npx prettier --write \
            src/components/ChatInput.tsx \
            src/components/LinkPreviewChip.tsx \
            src/components/PromptMessage.tsx \
            src/components/Sidebar.tsx \
            src/components/link-preview.css \
            src/lib/link-preview.mjs \
            src/lib/link-preview.d.mts \
            src/lib/link-preview.server.mjs \
            src/lib/link-preview.server.d.mts \
            src/routes/api/link-preview.ts \
            src/styles/spec400-chat.css \
            src/styles/sidebar-core.css \
            tests/unit/link-preview.test.mjs \
            tests/unit/chat-menu-spacing.test.mjs
      - name: Print inherited workflow formatting for separate reviewed update
        run: cat .github/workflows/repair-pr649-format.yml
      - name: Commit formatted changes to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/ChatInput.tsx \
            src/components/LinkPreviewChip.tsx \
            src/components/PromptMessage.tsx \
            src/components/Sidebar.tsx \
            src/components/link-preview.css \
            src/lib/link-preview.mjs \
            src/lib/link-preview.d.mts \
            src/lib/link-preview.server.mjs \
            src/lib/link-preview.server.d.mts \
            src/routes/api/link-preview.ts \
            src/styles/spec400-chat.css \
            src/styles/sidebar-core.css \
            tests/unit/link-preview.test.mjs \
            tests/unit/chat-menu-spacing.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Normalize Prettier formatting for PR 651"
            git push origin HEAD:feature/specific-page-link-preview-20261110
          fi
