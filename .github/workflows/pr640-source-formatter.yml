name: PR640 source formatter evidence
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/pr640-source-formatter.yml
permissions:
  contents: read
jobs:
  formatted-source:
    if: github.event.pull_request.number == 640
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format exact source without committing
        run: |
          npx --no-install prettier --write \
            src/components/ConversationHeaderActions.tsx \
            src/lib/home-chat-history-actions.ts \
            tests/e2e/chat-controls-owner-review.spec.ts \
            tests/e2e/public-website-approval.spec.ts \
            tests/e2e/requested-account-chat.spec.ts \
            tests/e2e/ui-account-experience.spec.ts \
            tests/unit/home-chat-history-actions.test.mjs
      - name: Preserve exact formatted source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr640-formatted-source
          path: |
            src/components/ConversationHeaderActions.tsx
            src/lib/home-chat-history-actions.ts
            tests/e2e/chat-controls-owner-review.spec.ts
            tests/e2e/public-website-approval.spec.ts
            tests/e2e/requested-account-chat.spec.ts
            tests/e2e/ui-account-experience.spec.ts
            tests/unit/home-chat-history-actions.test.mjs
          if-no-files-found: error
          retention-days: 2
