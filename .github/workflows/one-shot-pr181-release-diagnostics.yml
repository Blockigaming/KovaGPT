name: One-shot PR 181 release diagnostics

on:
  push:
    branches:
      - diag/pr181-release-checks-293b3d0
    paths:
      - .github/workflows/one-shot-pr181-release-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact failing source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: diag/pr181-release-checks-293b3d0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Reproduce and persist exact release output
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p artifacts/diagnostics
          set +e
          set -o pipefail
          (npm run release:bundle && npm run test:release) \
            2>&1 | tee artifacts/diagnostics/pr181-release-checks.log
          status=${PIPESTATUS[0]}
          set -e
          printf '\nEXIT_STATUS=%s\nSOURCE_SHA=%s\n' "$status" "$(git rev-parse HEAD)" \
            >> artifacts/diagnostics/pr181-release-checks.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-pr181-release-diagnostics.yml
          git add artifacts/diagnostics/pr181-release-checks.log
          git commit -m "Record PR 181 release-check diagnostics"
          git push origin HEAD:diag/pr181-release-checks-293b3d0
