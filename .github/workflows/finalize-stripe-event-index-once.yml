name: Finalize Stripe event timestamp index once

on:
  push:
    branches:
      - fix/fresh-db-stripe-event-timestamp-index
    paths:
      - .github/workflows/finalize-stripe-event-index-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/fresh-db-stripe-event-timestamp-index
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Align contract index inventory
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "database-contract.json";
          const source = fs.readFileSync(path, "utf8");
          const stale = '"processed_stripe_events_created_at_idx"';
          const current = '"processed_stripe_events_processed_at_idx"';
          const matches = source.split(stale).length - 1;
          if (matches !== 1) throw new Error(`expected exactly one stale index entry, found ${matches}`);
          if (source.includes(current)) throw new Error("new index already exists in contract");
          fs.writeFileSync(path, source.replace(stale, current));
          NODE

      - name: Format focused test and contract
        run: >-
          npx prettier --write
          database-contract.json
          tests/unit/stripe-event-timestamp-index-migration.test.mjs

      - name: Run executable migration regression tests
        run: node --test tests/unit/stripe-event-timestamp-index-migration.test.mjs

      - name: Regenerate and verify migration manifest
        run: |
          set -euo pipefail
          npm run release:manifest
          npm run release:migrations

      - name: Remove this one-shot workflow
        run: rm .github/workflows/finalize-stripe-event-index-once.yml

      - name: Commit deterministic outputs
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Stripe event timestamp index repair"
          git push origin HEAD:fix/fresh-db-stripe-event-timestamp-index
