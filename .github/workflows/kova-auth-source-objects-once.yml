name: Kova Auth Repair Source Objects (once)
on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-source-objects-once.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish only exact verified blobs and tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY_SOURCE'
          import base64, hashlib, json, lzma, os, time, urllib.request, urllib.error
          REPO = 'Blockigaming/KovaGPT'
          BRANCH = 'refs/heads/codex/kova-owned-auth-foundation'
          BASE = 'f580f864d1c2f399ee1c01c1fce1d454fecaac79'
          BASE_TREE = '5064ebb9d6f192fc0e202f46d5c8d97c27b2fef9'
          TARGET_TREE = '1a28a948189c03cc2ee61bfeb697d266ce10f667'
          WORKFLOW = '.github/workflows/kova-auth-source-objects-once.yml'
          MANIFEST_SHA = '0b0d1fe4d13380918f3ab48b7c9965802ed4877563d8b8d8204b8a26dc3ef3f9'
          CHUNKS = [('b47e5828da1d27613c15d23bca5598c1e9e8335e',6800),('582fc6eb1d9b8086a5512540175bb43cd38d6693',6800),('9e5b95fe1c0339e64d7a36890920f96128b2f262',6800),('8bddbe40b733fcabdfa6f5db42b92776bcb39924',6800),('cb8102345f9652bd04ae41ca85180b343c0088ad',6800),('2415e5be2a80cbc0b2db29b40f42bad4168f5f7e',6800),('ac3e67892d8df85628999d656b45d2bfc7733974',5)]
          DEADLINE = time.monotonic() + 420
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('unexpected_redirect')
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(method, path, body=None):
              if method not in ('GET','POST') or not path.startswith('/') or '..' in path:
                  raise RuntimeError('unapproved_operation')
              if method == 'POST' and path not in ('/git/blobs','/git/trees'):
                  raise RuntimeError('unapproved_write')
              remaining = DEADLINE - time.monotonic()
              if remaining <= 0:
                  raise RuntimeError('publication_deadline')
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path, method=method,
                  data=None if body is None else json.dumps(body).encode(), headers={
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=min(25,remaining)) as response:
                      data = response.read(2_000_001)
                      if len(data) > 2_000_000:
                          raise RuntimeError('response_limit')
                      return json.loads(data)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('github_http_' + str(error.code)) from None
          def read_blob(expected):
              row = api('GET','/git/blobs/' + expected)
              if row['encoding'] != 'base64':
                  raise RuntimeError('blob_encoding')
              data = base64.b64decode(''.join(row['content'].split()),validate=True)
              if blob_sha(data) != expected:
                  raise RuntimeError('blob_hash')
              return data
          def main():
              if os.environ['GITHUB_REPOSITORY'] != REPO or os.environ['GITHUB_REF'] != BRANCH:
                  raise RuntimeError('wrong_scope')
              head = os.environ['GITHUB_SHA']
              if [p['sha'] for p in api('GET','/git/commits/' + head)['parents']] != [BASE]:
                  raise RuntimeError('wrong_parent')
              commit = api('GET','/commits/' + head)
              if [(f['filename'],f['status']) for f in commit['files']] != [(WORKFLOW,'added')]:
                  raise RuntimeError('source_changed')
              if api('GET','/git/ref/heads/codex/kova-owned-auth-foundation')['object']['sha'] != head:
                  raise RuntimeError('branch_advanced')
              if api('GET','/git/commits/' + BASE)['tree']['sha'] != BASE_TREE:
                  raise RuntimeError('base_tree_changed')
              chunks=[]
              for sha,size in CHUNKS:
                  data=read_blob(sha)
                  if len(data) != size:
                      raise RuntimeError('chunk_size')
                  chunks.append(data)
              decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
              raw=decoder.decompress(base64.b85decode(b''.join(chunks)),max_length=200001)
              if len(raw) != 149201 or not decoder.eof or decoder.unused_data or hashlib.sha256(raw).hexdigest() != MANIFEST_SHA:
                  raise RuntimeError('manifest_integrity')
              manifest=json.loads(raw)
              if (manifest['base'],manifest['base_tree'],manifest['tree']) != (BASE,BASE_TREE,TARGET_TREE) or len(manifest['files']) != 53:
                  raise RuntimeError('manifest_scope')
              entries=[]; paths=set(); total=0
              for item in manifest['files']:
                  path=item['path']
                  if not isinstance(path,str) or path in paths or '\\' in path or any(p in ('','.','..') for p in path.split('/')):
                      raise RuntimeError('invalid_path')
                  if not (path.startswith(('src/','tests/','supabase/migrations/')) or path in ('database-contract.json','release-migrations.json','.github/workflows/kova-owned-auth-source.yml')):
                      raise RuntimeError('unapproved_path')
                  paths.add(path)
                  before='' if item['before'] is None else read_blob(item['before']).decode('utf-8')
                  if item['after'] is None:
                      entries.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
                  if item['mode'] not in ('100644','100755'):
                      raise RuntimeError('invalid_mode')
                  last=0
                  for start,end,replacement in item['edits']:
                      if type(start) is not int or type(end) is not int or not last <= start <= end <= len(before) or not isinstance(replacement,str):
                          raise RuntimeError('invalid_edit')
                      last=end
                  for start,end,replacement in reversed(item['edits']):
                      before=before[:start]+replacement+before[end:]
                  after=before.encode('utf-8'); total+=len(after)
                  if total > 3000000 or blob_sha(after) != item['after']:
                      raise RuntimeError('source_hash')
                  result=api('POST','/git/blobs',{'encoding':'utf-8','content':before})
                  if result['sha'] != item['after']:
                      raise RuntimeError('uploaded_hash')
                  entries.append({'path':path,'mode':item['mode'],'type':'blob','sha':result['sha']})
              result=api('POST','/git/trees',{'base_tree':BASE_TREE,'tree':entries})
              if result['sha'] != TARGET_TREE:
                  raise RuntimeError('published_tree')
              if api('GET','/git/ref/heads/codex/kova-owned-auth-foundation')['object']['sha'] != head:
                  raise RuntimeError('branch_advanced_after_objects')
              receipt={'workflow_head':head,'base':BASE,'verified_tree':TARGET_TREE,'verified_files':len(entries),'ref_updated':False,'deployed':False}
              print(json.dumps(receipt,sort_keys=True))
          if __name__ == '__main__':
              main()
          PY_SOURCE
