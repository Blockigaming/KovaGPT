name: Temporary PR 641 formatting diagnostic

on:
  push:
    branches:
      - fix/postmerge-release-browser-contracts-20261109

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show expected Prettier changes without modifying files
        run: |
          npx prettier src/components/interactive-ui/InteractiveBlock.tsx > /tmp/expected.tsx
          diff -u src/components/interactive-ui/InteractiveBlock.tsx /tmp/expected.tsx || true
