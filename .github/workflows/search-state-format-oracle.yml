name: Search state formatter oracle

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'codex/global-search-keyboard-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print locked Prettier output
        shell: bash
        run: |
          npx prettier --write src/components/CommandPalette.tsx tests/integration/global-search-keyboard-source.test.mjs
          for file in src/components/CommandPalette.tsx tests/integration/global-search-keyboard-source.test.mjs; do
            echo "FORMAT_ORACLE_BEGIN:$file"
            base64 -w 0 "$file"
            echo
            echo "FORMAT_ORACLE_END:$file"
          done
