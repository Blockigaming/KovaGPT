name: One-time Kova PR 579 formatter
on:
  push:
    branches:
      - feat/kova-xenon-neon-argon-migration
    paths:
      - .github/workflows/kova-pr579-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format changed source and documentation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -d '' changed < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD)
          if [ "${#changed[@]}" -eq 0 ]; then exit 0; fi
          ./node_modules/.bin/prettier --write --ignore-unknown "${changed[@]}"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "kova-ci-format"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Kova model migration branch"
          git push origin HEAD:refs/heads/feat/kova-xenon-neon-argon-migration
