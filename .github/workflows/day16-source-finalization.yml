name: Day 16 Source Finalization

on:
  push:
    branches:
      - finalization/checkpoint-2026-08-28
    paths-ignore:
      - docs/day16/MASTER_LEDGER.json
      - docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md

permissions:
  contents: write

concurrency:
  group: day16-source-finalization
  cancel-in-progress: true

jobs:
  source-finalization:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      KOVA_NITRO_PRESET: node-server
    steps:
      - name: Check out checkpoint branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: finalization/checkpoint-2026-08-28
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate migration manifest
        run: npm run release:manifest

      - name: Generate TanStack route tree
        run: npm run build

      - name: Normalize generated and newly added source files
        run: npx prettier --write release-migrations.json docs/day16/MASTER_LEDGER.json src/routes/api/admin/testimonials.ts src/lib/testimonials.functions.ts src/components/TestimonialSubmissionDialog.tsx src/routes/contact-support.tsx tests/unit/day16-testimonial-system.test.mjs .github/workflows/day16-source-finalization.yml

      - name: Commit generated normalization when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated files already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release-migrations.json src/routeTree.gen.ts docs/day16/MASTER_LEDGER.json src/routes/api/admin/testimonials.ts src/lib/testimonials.functions.ts src/components/TestimonialSubmissionDialog.tsx src/routes/contact-support.tsx tests/unit/day16-testimonial-system.test.mjs .github/workflows/day16-source-finalization.yml
            git commit -m "chore: normalize testimonial finalization sources"
            git push origin HEAD:finalization/checkpoint-2026-08-28
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Integration tests
        run: npm run test:integration

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Visual source tests
        run: npm run test:visual

      - name: Migration release gate
        run: npm run release:migrations

      - name: Migration preflight
        run: npm run release:migration-preflight

      - name: Day 16 source ledger gate
        run: npm run release:day16:source

      - name: Final source build
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Render local release matrix
        run: npm run test:e2e:release:signed-out

      - name: Write durable visual evidence record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/day16
          HEAD_SHA="$(git rev-parse HEAD)"
          cat > docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md <<EOF
          # Local Visual Runtime Evidence

          - Verification status: PASS
          - Exact checkpoint SHA: \`$HEAD_SHA\`
          - GitHub Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Browser engines: Chromium, Firefox, WebKit
          - Required widths: 320, 375, 390, 768, 1024, 1280, 1440, 1728
          - Themes: light and dark
          - Rendered states: signed-out shell, focused composer, filled composer/send state, critical public routes, API failure boundaries
          - Harness: \`playwright.release.config.ts\`
          - Test suite: \`tests/release-browser/final-matrix.spec.ts\`
          - Evidence artifacts: JUnit browser matrix, HTML report, traces on failure, full-page screenshots attached by the matrix tests

          This record is written only after the rendered local matrix and all source quality gates pass. Authenticated production-browser evidence remains a separate production requirement and is not claimed here.
          EOF

      - name: Promote final source ledger item
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "docs/day16/MASTER_LEDGER.json";
          const ledger = JSON.parse(fs.readFileSync(path, "utf8"));
          const item = ledger.items.find((candidate) => candidate.id === "local_visual_runtime_matrix");
          if (!item) throw new Error("local_visual_runtime_matrix ledger item not found");
          item.status = "verified_local";
          item.evidence = [
            "docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md",
            "playwright.release.config.ts",
            "tests/release-browser/final-matrix.spec.ts",
            "Chromium/Firefox/WebKit rendered matrix across all required widths, light/dark themes, composer states, public route sweeps and failure boundaries",
          ];
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`);
          NODE
          npx prettier --write docs/day16/MASTER_LEDGER.json docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md
          npm run release:day16:ledger

      - name: Commit source-finalization evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/day16/MASTER_LEDGER.json docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md
          git commit -m "chore: verify complete Day 16 source matrix"
          git push origin HEAD:finalization/checkpoint-2026-08-28

      - name: Upload rendered browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day16-source-visual-${{ github.run_id }}
          path: |
            artifacts/release/
            artifacts/release-browser-report/
            artifacts/release-browser-results/
          if-no-files-found: warn
          retention-days: 30
