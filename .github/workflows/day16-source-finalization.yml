name: Day 16 Source Finalization

on:
  push:
    branches:
      - finalization/checkpoint-2026-08-28
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: day16-source-finalization
  cancel-in-progress: false

jobs:
  source-finalization:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      KOVA_NITRO_PRESET: node-server
      KOVA_RELEASE_AUTH_STATE_B64: ${{ secrets.KOVA_RELEASE_AUTH_STATE_B64 }}
    steps:
      - name: Check out checkpoint branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: finalization/checkpoint-2026-08-28
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate migration manifest
        run: npm run release:manifest

      - name: Commit generated migration manifest when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release-migrations.json; then
            echo "Migration manifest already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release-migrations.json
            git commit -m "chore: refresh migration manifest for testimonials"
            git push origin HEAD:finalization/checkpoint-2026-08-28
          fi

      - name: Run source quality gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:api
          npm run test:integration
          npm run test:a11y
          npm run test:visual
          npm run release:migrations
          npm run release:migration-preflight
          npm run release:day16:source
          npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Render signed-out local release matrix
        run: npm run test:e2e:release:signed-out

      - name: Decode signed-in local browser state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KOVA_RELEASE_AUTH_STATE_B64" || {
            echo "KOVA_RELEASE_AUTH_STATE_B64 is required to verify signed-in rendered states." >&2
            exit 1
          }
          umask 077
          AUTH_STATE="$RUNNER_TEMP/kova-release-auth-state.json"
          printf '%s' "$KOVA_RELEASE_AUTH_STATE_B64" | base64 --decode > "$AUTH_STATE"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$AUTH_STATE"
          echo "KOVA_RELEASE_AUTH_STATE=$AUTH_STATE" >> "$GITHUB_ENV"

      - name: Render signed-in local release matrix
        run: npm run test:e2e:release:signed-in

      - name: Write durable visual evidence record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/day16
          HEAD_SHA="$(git rev-parse HEAD)"
          cat > docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md <<EOF
          # Local Visual Runtime Evidence

          - Verification status: PASS
          - Exact checkpoint SHA: \`$HEAD_SHA\`
          - GitHub Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Browser engines: Chromium, Firefox, WebKit
          - Required widths: 320, 375, 390, 768, 1024, 1280, 1440, 1728
          - Themes: light and dark
          - Authentication states: signed out and signed in
          - Harness: \`playwright.release.config.ts\`
          - Test suite: \`tests/release-browser/final-matrix.spec.ts\`
          - Evidence artifacts: JUnit browser matrices, HTML report, traces on failure, full-page screenshots attached by the matrix tests

          This record is written only after both signed-out and signed-in rendered matrices and all source quality gates pass.
          EOF

      - name: Promote final source ledger item
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "docs/day16/MASTER_LEDGER.json";
          const ledger = JSON.parse(fs.readFileSync(path, "utf8"));
          const item = ledger.items.find((candidate) => candidate.id === "local_visual_runtime_matrix");
          if (!item) throw new Error("local_visual_runtime_matrix ledger item not found");
          item.status = "verified_local";
          item.evidence = [
            "docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md",
            "playwright.release.config.ts",
            "tests/release-browser/final-matrix.spec.ts",
            "signed-out and signed-in Chromium/Firefox/WebKit matrices across all required widths and light/dark themes",
          ];
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`);
          NODE
          npm run release:day16:ledger

      - name: Commit source-finalization evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/day16/MASTER_LEDGER.json docs/day16/LOCAL_VISUAL_RUNTIME_EVIDENCE.md
          git commit -m "chore: verify complete Day 16 source matrix"
          git push origin HEAD:finalization/checkpoint-2026-08-28

      - name: Upload rendered browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day16-source-visual-${{ github.run_id }}
          path: |
            artifacts/release/
            artifacts/release-browser-report/
            artifacts/release-browser-results/
          if-no-files-found: warn
          retention-days: 30
