name: Diagnose GitHub sign-in formatting
on:
  pull_request:
    paths:
      - .github/workflows/diagnose-github-login-format.yml
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/routes/auth.tsx tests/unit/hosted-github-login-redirect.test.mjs
          git diff -- src/routes/auth.tsx tests/unit/hosted-github-login-redirect.test.mjs
