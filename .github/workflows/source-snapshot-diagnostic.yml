name: Source Snapshot Diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.number == 175
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Archive current tracked source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- -czf kova-source-snapshot.tgz

      - name: Upload current tracked source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kova-source-snapshot-${{ github.event.pull_request.head.sha }}
          path: kova-source-snapshot.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Checkout reviewed UI baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 455a53c08725d02d38320d06d88bb207f9b5d4e5
          path: reviewed-ui-baseline

      - name: Archive reviewed UI baseline
        shell: bash
        working-directory: reviewed-ui-baseline
        run: git ls-files -z | tar --null --files-from=- -czf ../reviewed-ui-baseline.tgz

      - name: Upload reviewed UI baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-ui-baseline-455a53c
          path: reviewed-ui-baseline.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Checkout reviewed release baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8ef0392e50f0519bb3f4fc82837888100d08b10b
          path: reviewed-release-baseline

      - name: Archive reviewed release baseline
        shell: bash
        working-directory: reviewed-release-baseline
        run: git ls-files -z | tar --null --files-from=- -czf ../reviewed-release-baseline.tgz

      - name: Upload reviewed release baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-release-baseline-8ef0392
          path: reviewed-release-baseline.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Checkout last all-integration-green source baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0a426ff3dab49cca1bdcbb2562806d86f01e44e7
          path: integration-green-baseline

      - name: Archive last all-integration-green source baseline
        shell: bash
        working-directory: integration-green-baseline
        run: git ls-files -z | tar --null --files-from=- -czf ../integration-green-baseline.tgz

      - name: Upload last all-integration-green source baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-green-baseline-0a426ff
          path: integration-green-baseline.tgz
          if-no-files-found: error
          retention-days: 1
