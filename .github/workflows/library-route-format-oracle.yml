name: Library route formatter oracle

on:
  push:
    branches:
      - codex/library-folder-ui-20260904

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print locked Prettier output
        shell: bash
        run: |
          echo "FORMAT_ORACLE_BEGIN:src/routes/library.tsx"
          npx prettier src/routes/library.tsx | base64 -w0
          echo
          echo "FORMAT_ORACLE_END:src/routes/library.tsx"
