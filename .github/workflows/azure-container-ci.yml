name: Azure Container Readiness

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: azure-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_GENERATION_ENABLED: "false"
      HOST: 0.0.0.0
      PORT: 3000
      AZURE_ENVIRONMENT: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify Azure changes
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(\.github/workflows/(azure-container-ci|ca-kovagpt-dev-AutoDeployTrigger-1724b7ba-d38e-4fd3-95e8-bef7f7fbc290|validate-azure-production)\.yml$|\.dockerignore$|Dockerfile$|\.env\.example$|package(-lock)?\.json$|infra/azure/|scripts/azure/|src/lib/azure-runtime-env\.server\.ts$|src/lib/readiness\.server\.ts$|src/routes/api/health\.ts$|src/server\.ts$|src/start\.ts$|vite\.config\.ts$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Azure/container-sensitive files changed; expensive readiness stages are skipped."
          fi

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting changed files
        if: steps.scope.outputs.run == 'true'
        run: npm run format:check:changed

      - name: Legacy repository formatting audit
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: TypeScript typecheck
        if: steps.scope.outputs.run == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: npm run test:unit

      - name: Azure readiness validation
        if: steps.scope.outputs.run == 'true'
        run: npm run azure:validate

      - name: Production build
        if: steps.scope.outputs.run == 'true'
        run: KOVA_BROWSER_PREVIEW=node npm run build

      - name: Docker image build
        if: steps.scope.outputs.run == 'true'
        run: npm run container:build

      - name: Container startup
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run -d --name kovagpt-web-ci \
            -e AI_GENERATION_ENABLED=false \
            -e AZURE_ENVIRONMENT=ci \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -p 3000:3000 \
            kovagpt-web:azure-dev
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            docker logs kovagpt-web-ci || true
            sleep 2
          done
          docker logs kovagpt-web-ci
          exit 1

      - name: Health smoke test
        if: steps.scope.outputs.run == 'true'
        run: npm run container:smoke

      - name: Container shutdown
        if: always() && steps.scope.outputs.run == 'true'
        run: docker rm -f kovagpt-web-ci || true
