name: Azure Container Readiness

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_GENERATION_ENABLED: "false"
      HOST: 0.0.0.0
      PORT: 3000
      AZURE_ENVIRONMENT: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting changed files
        run: npm run format:check:changed

      - name: Legacy repository formatting audit
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Azure readiness validation
        run: npm run azure:validate

      - name: Production build
        run: KOVA_BROWSER_PREVIEW=node npm run build

      - name: Docker image build
        run: npm run container:build

      - name: Container startup
        run: |
          docker run -d --name kovagpt-web-ci \
            -e AI_GENERATION_ENABLED=false \
            -e AZURE_ENVIRONMENT=ci \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -p 3000:3000 \
            kovagpt-web:azure-dev
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            docker logs kovagpt-web-ci || true
            sleep 2
          done
          docker logs kovagpt-web-ci
          exit 1

      - name: Health smoke test
        run: npm run container:smoke

      - name: Container shutdown
        if: always()
        run: docker rm -f kovagpt-web-ci || true
