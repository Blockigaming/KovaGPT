name: Publish authorized S6 commit without changing its identity
on:
  push:
    branches: [codex/s6-publication-0d8caf6]
    paths: [.github/workflows/s6-authorized-publication.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/s6-publication-0d8caf6'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c92fdbfea58a0917f34c25264d7b8b40a78a47fb
          fetch-depth: 1
      - name: Import the explicitly authorized three-commit bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          blob='bb687e1d205394a78f83665bdacbbf69d5302d0f'
          request=urllib.request.Request(
            'https://api.github.com/repos/Blockigaming/KovaGPT/git/blobs/'+blob,
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
            result=json.load(response)
          data=base64.b64decode(result['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
          assert hashlib.sha256(data).hexdigest()=='e1da49dea0a188e9146090d0ecd833ab965b77dab5d065ca89f97bd44dd2d30e'
          pathlib.Path(os.environ['RUNNER_TEMP'],'s6.bundle').write_bytes(data)
          PY
          git bundle verify "$RUNNER_TEMP/s6.bundle"
          git fetch "$RUNNER_TEMP/s6.bundle" refs/heads/codex/s6-preparation-20260930
          test "$(git rev-parse FETCH_HEAD)" = 0d8caf63301f494e0366fade8ce2bf0b74455574
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = a97c8ea39fe8caa500ff33aaed125fa955da06d1
          test "$(git rev-list --count c92fdbfea58a0917f34c25264d7b8b40a78a47fb..FETCH_HEAD)" = 3
          git merge-base --is-ancestor c92fdbfea58a0917f34c25264d7b8b40a78a47fb FETCH_HEAD
          timeout 45s git push origin FETCH_HEAD:refs/heads/codex/s6-preparation-20260930
          test "$(git ls-remote origin refs/heads/codex/s6-preparation-20260930 | cut -f1)" = 0d8caf63301f494e0366fade8ce2bf0b74455574
          echo "Published existing S6 commit 0d8caf63301f494e0366fade8ce2bf0b74455574; no merge, deployment, or app start." >> "$GITHUB_STEP_SUMMARY"
