name: One-shot verify bundle gate

on:
  push:
    branches:
      - fix/production-supabase-retarget-preflight

permissions:
  contents: write

concurrency:
  group: one-shot-verify-bundle-gate
  cancel-in-progress: false

jobs:
  format-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/production-supabase-retarget-preflight
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply canonical formatting
        run: npx prettier --write scripts/release/bundle-budget.mjs tests/unit/bundle-budget.test.mjs

      - name: Run focused unit coverage
        run: node --test tests/unit/bundle-budget.test.mjs

      - name: Build and enforce the repaired bundle gate
        run: |
          npm run build
          npm run release:bundle

      - name: Commit verified formatting and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-verify-bundle-gate.yml
          git add scripts/release/bundle-budget.mjs tests/unit/bundle-budget.test.mjs
          git diff --cached --check
          git config user.name "KovaGPT release automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Verify the repaired browser bundle gate"
          git push origin HEAD:fix/production-supabase-retarget-preflight
