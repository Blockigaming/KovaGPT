name: Format PR 647 candidate once

on:
  push:
    branches:
      - feat/account-offers-workspace-discovery-notices-20261110

permissions:
  contents: write

concurrency:
  group: format-pr-647
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only changed candidate files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only -z --diff-filter=ACMRT origin/main...HEAD |
            xargs -0 -r ./node_modules/.bin/prettier --write --ignore-unknown --

      - name: Confirm formatting gates
        run: |
          npm run format:check:changed
          npm run format:check

      - name: Remove one-time workflow and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr-647-format-once.yml
          git add -u
          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply pinned Prettier to notification PR'
          git push origin "HEAD:${GITHUB_REF_NAME}"
