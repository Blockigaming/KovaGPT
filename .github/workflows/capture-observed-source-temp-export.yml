name: Capture observed source temporary export

on:
  pull_request:
    paths:
      - .github/workflows/capture-observed-source-temp-export.yml
      - scripts/release/capture-observed-source-temp-export.mjs
      - scripts/release/migration-proof-catalog.mjs
      - scripts/release/migration-proof-catalog.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay exact observed source checkpoint in disposable local database
        run: node scripts/release/capture-observed-source-temp-export.mjs --with-full-catalog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observed-source-temp-export-candidate
          path: |
            artifacts/release/observed-source-temp-export.json
            artifacts/release/observed-source-full-catalog.json
          if-no-files-found: error
          retention-days: 14
