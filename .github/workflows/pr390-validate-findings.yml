name: PR390 validate findings
on:
  push:
    branches: [codex/issue-208-production-evidence]
    paths: [.github/workflows/pr390-validate-findings.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and test
        run: |
          node node_modules/prettier/bin/prettier.cjs --write scripts/release/zero-lovable-production.mjs tests/unit/zero-lovable-production-evidence.test.mjs
          node --test tests/unit/zero-lovable-production-evidence.test.mjs
          git diff --check
      - name: Commit and self-remove
        run: |
          rm .github/workflows/pr390-validate-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release/zero-lovable-production.mjs tests/unit/zero-lovable-production-evidence.test.mjs .github/workflows/pr390-validate-findings.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: validate PR 390 review fixes"
          git push origin HEAD:"$GITHUB_REF_NAME"
