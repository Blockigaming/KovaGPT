name: Kova Auth Count Repair Once

on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-count-repair-once.yml]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: kova-auth-count-repair-once
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only exact pinned test corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 65e5f50eac161447ad45ba40b249ac2521bb5a53
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/kova-auth-count-repair-once.yml
          python3 - <<'PATCH'
          import hashlib, pathlib, subprocess
          files = {
            'tests/unit/upgrade-database-scheduled-catalog.test.mjs': ('34540135093c04bf80f96c7e5fab78fb4a4a72a5', 'b6cddf0a6b9f2c0e49f3629ac2594342890873cd'),
            'tests/unit/upgrade-database-scheduled-tables.test.mjs': ('4ff0ed1fd49ffcd94d3cd7b64e38b1d36c05899a', '33c64685b9da0eba7309c276a232db270ee784a4'),
            'tests/unit/upgrade-database-temp-export-proof.test.mjs': ('c82b8ac47e9ff4028f13bf5474d3ab8f410044b8', '9629d9194b8e15df41f3e1a375602532bc1678bc'),
            'tests/unit/upgrade-source-provenance.test.mjs': ('cfa0107234df58c02437acfeea2bcb8c7db21963', 'cfdd180bf6261659f7c42bf833785fe3c6ac902b'),
          }
          def blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, (before, after) in files.items():
            path = pathlib.Path(name)
            assert path.is_file() and not path.is_symlink()
            data = path.read_bytes()
            assert blob(data) == before
            if name.endswith('upgrade-source-provenance.test.mjs'):
              replacements = [(b'actual.pendingVersions.length, 93', b'actual.pendingVersions.length, 95'), (b'actual.forwardMigrations.length, 92', b'actual.forwardMigrations.length, 94')]
            else:
              replacements = [(b'upgraded.capture.ledgerVersionCount, 190', b'upgraded.capture.ledgerVersionCount, 192'), (b'result.forwardMigrations.length, 92', b'result.forwardMigrations.length, 94')]
            for old, new in replacements:
              assert data.count(old) == 1
              data = data.replace(old, new)
            assert blob(data) == after
            path.write_bytes(data)
          subprocess.run(['git', 'add', '--', *files], check=True)
          PATCH
          index="$RUNNER_TEMP/count-repair.index"
          cp "$(git rev-parse --git-path index)" "$index"
          GIT_INDEX_FILE="$index" git rm --cached --quiet -- .github/workflows/kova-auth-count-repair-once.yml
          test "$(GIT_INDEX_FILE="$index" git write-tree)" = 42d372b4d48b88a57c2fe65866a91a31c2731b0e
          rm "$index"
          git diff --exit-code
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All unit tests including full-range migration proof
        run: node --test --test-concurrency=2 tests/unit/*.test.mjs
      - name: Verify formatting and no source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --name-only -z | xargs -0 npx --no-install prettier --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  publish:
    needs: verify
    if: needs.verify.result == 'success' && github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only verified blobs against the unchanged authorized head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 65e5f50eac161447ad45ba40b249ac2521bb5a53
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/kova-auth-count-repair-once.yml
          python3 - <<'PATCH'
          import hashlib, pathlib, subprocess
          files = {
            'tests/unit/upgrade-database-scheduled-catalog.test.mjs': ('34540135093c04bf80f96c7e5fab78fb4a4a72a5', 'b6cddf0a6b9f2c0e49f3629ac2594342890873cd'),
            'tests/unit/upgrade-database-scheduled-tables.test.mjs': ('4ff0ed1fd49ffcd94d3cd7b64e38b1d36c05899a', '33c64685b9da0eba7309c276a232db270ee784a4'),
            'tests/unit/upgrade-database-temp-export-proof.test.mjs': ('c82b8ac47e9ff4028f13bf5474d3ab8f410044b8', '9629d9194b8e15df41f3e1a375602532bc1678bc'),
            'tests/unit/upgrade-source-provenance.test.mjs': ('cfa0107234df58c02437acfeea2bcb8c7db21963', 'cfdd180bf6261659f7c42bf833785fe3c6ac902b'),
          }
          def blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, (before, after) in files.items():
            path = pathlib.Path(name)
            assert path.is_file() and not path.is_symlink()
            data = path.read_bytes()
            assert blob(data) == before
            if name.endswith('upgrade-source-provenance.test.mjs'):
              replacements = [(b'actual.pendingVersions.length, 93', b'actual.pendingVersions.length, 95'), (b'actual.forwardMigrations.length, 92', b'actual.forwardMigrations.length, 94')]
            else:
              replacements = [(b'upgraded.capture.ledgerVersionCount, 190', b'upgraded.capture.ledgerVersionCount, 192'), (b'result.forwardMigrations.length, 92', b'result.forwardMigrations.length, 94')]
            for old, new in replacements:
              assert data.count(old) == 1
              data = data.replace(old, new)
            assert blob(data) == after
            path.write_bytes(data)
          subprocess.run(['git', 'add', '--', *files], check=True)
          PATCH
          index="$RUNNER_TEMP/count-repair.index"
          cp "$(git rev-parse --git-path index)" "$index"
          GIT_INDEX_FILE="$index" git rm --cached --quiet -- .github/workflows/kova-auth-count-repair-once.yml
          test "$(GIT_INDEX_FILE="$index" git write-tree)" = 42d372b4d48b88a57c2fe65866a91a31c2731b0e
          rm "$index"
          git diff --exit-code
          gh api repos/Blockigaming/KovaGPT/pulls/394 > "$RUNNER_TEMP/count-pr.json"
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'count-pr.json').read_text())
          assert pr['state'] == 'open' and not pr['merged']
          assert pr['head']['sha'] == os.environ['GITHUB_SHA']
          assert pr['head']['ref'] == 'codex/kova-owned-auth-foundation'
          assert pr['head']['repo']['full_name'] == 'Blockigaming/KovaGPT'
          assert pr['base']['ref'] == 'main'
          CHECK
          git -c core.hooksPath=/dev/null -c user.name='KovaGPT Source Validation' -c user.email='source-validation@users.noreply.github.com' commit -m 'test(auth): bind full-range migration proofs to both new repair migrations'
          askpass="$RUNNER_TEMP/count-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/usr/bin/env bash' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *Password*) printf "%s\n" "$GH_TOKEN" ;; *) exit 1 ;; esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$askpass" git -c core.hooksPath=/dev/null push https://github.com/Blockigaming/KovaGPT.git HEAD:refs/heads/codex/kova-owned-auth-foundation
          printf 'Published test repair: %s\n' "$(git rev-parse HEAD)"
