name: Supabase recovery template isolated repair run

on:
  push:
    branches:
      - ops/supabase-recovery-template-repair-20260902
    paths:
      - .github/workflows/supabase-recovery-template-repair-run.yml

permissions:
  contents: read

concurrency:
  group: supabase-recovery-template-repair
  cancel-in-progress: false

jobs:
  repair:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_REF: mfbycmbjygcfkrsuepxf
      TARGET_SUBJECT: Reset your KovaGPT password
      TARGET_EMAIL: zacharylblock@gmail.com
      TARGET_REDIRECT_TO: https://kovagpt.com/reset-password
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read, minimally patch, verify, and send one recovery email
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable in the production environment."
            exit 2
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const required = ['PROJECT_REF', 'TARGET_SUBJECT', 'TARGET_EMAIL', 'TARGET_REDIRECT_TO', 'SUPABASE_ACCESS_TOKEN'];
          for (const name of required) if (!process.env[name]) throw new Error(`${name} is required`);

          const projectRef = process.env.PROJECT_REF;
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/config/auth`;
          const logoUrl = `https://${projectRef}.supabase.co/storage/v1/object/public/brand-assets/kova-logo.png`;
          const body = `<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta name="color-scheme" content="dark">
              <meta name="supported-color-schemes" content="dark">
              <title>Reset your KovaGPT password</title>
            </head>
            <body style="margin:0;padding:0;background-color:#0a0b0d;color:#f7f7f8;font-family:Arial,Helvetica,sans-serif;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#0a0b0d" style="width:100%;background-color:#0a0b0d;">
                <tr><td align="center" style="padding:40px 16px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#15171c" style="width:100%;max-width:560px;background-color:#15171c;border:1px solid #2a2e36;border-radius:20px;">
                    <tr><td style="padding:32px 32px 10px;">
                      <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr>
                        <td style="vertical-align:middle;padding-right:12px;"><img src="${logoUrl}" width="44" height="44" alt="KovaGPT" style="display:block;width:44px;height:44px;border:0;border-radius:12px;"></td>
                        <td style="vertical-align:middle;color:#f7f7f8;font-size:20px;font-weight:700;letter-spacing:-0.3px;">KovaGPT</td>
                      </tr></table>
                    </td></tr>
                    <tr><td style="padding:20px 32px 32px;">
                      <h1 style="margin:0 0 16px;color:#f7f7f8;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-0.8px;">Reset your password</h1>
                      <p style="margin:0 0 24px;color:#c9ccd3;font-size:16px;line-height:1.6;">We received a request to reset the password for your KovaGPT account. Use the secure button below to choose a new password.</p>
                      <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;"><tr><td align="center" bgcolor="#f7f7f8" style="border-radius:12px;">
                        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#0a0b0d;font-size:16px;line-height:20px;font-weight:700;text-decoration:none;border-radius:12px;">Reset password</a>
                      </td></tr></table>
                      <p style="margin:0 0 18px;color:#8f949e;font-size:13px;line-height:1.55;">For your security, this recovery link is single-use. If the button does not open, copy and paste this URL into your browser:</p>
                      <p style="margin:0;word-break:break-all;color:#b9bec8;font-size:12px;line-height:1.55;"><a href="{{ .ConfirmationURL }}" style="color:#d7dae0;text-decoration:underline;">{{ .ConfirmationURL }}</a></p>
                    </td></tr>
                    <tr><td style="padding:22px 32px 30px;border-top:1px solid #2a2e36;">
                      <p style="margin:0;color:#8f949e;font-size:13px;line-height:1.55;">If you did not request this password reset, you can safely ignore this email. Your password will not change.</p>
                    </td></tr>
                  </table>
                  <p style="margin:18px 0 0;color:#666b75;font-size:12px;line-height:1.5;">KovaGPT · Secure account recovery</p>
                </td></tr>
              </table>
            </body>
          </html>`;

          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          if ((body.match(/{{ \.ConfirmationURL }}/g) || []).length !== 3) throw new Error('canonical body has an invalid template-variable set');
          if (!body.includes('background-color:#0a0b0d') || !body.includes('/brand-assets/kova-logo.png')) throw new Error('canonical dark-brand markers missing');

          const source = fs.readFileSync('src/config/public-config.ts', 'utf8');
          if (!source.includes(`https://${projectRef}.supabase.co`) || !source.includes(`PUBLIC_BACKEND_PROJECT_ID = "${projectRef}"`)) {
            throw new Error('runtime public Supabase target does not match the approved production project');
          }
          const keyMatch = source.match(/PUBLIC_BACKEND_KEY\s*=\s*"([^"]+)"/);
          if (!keyMatch) throw new Error('production publishable key is absent from public config');
          const publishableKey = keyMatch[1];

          const logoResponse = await fetch(logoUrl);
          if (!logoResponse.ok || Number(logoResponse.headers.get('content-length') || 1) === 0) throw new Error(`public logo check failed: ${logoResponse.status}`);

          const managementHeaders = {
            Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
            Accept: 'application/json',
          };
          const readConfig = async () => {
            const response = await fetch(endpoint, { headers: managementHeaders });
            if (!response.ok) throw new Error(`Auth config GET failed: ${response.status} ${await response.text()}`);
            return response.json();
          };
          const hookSummary = cfg => Object.fromEntries(Object.entries(cfg)
            .filter(([key]) => /hook.*send.*email|send.*email.*hook/i.test(key))
            .map(([key, value]) => {
              if (/secret|token|key/i.test(key)) return [key, '[redacted]'];
              if (typeof value === 'string' && /^https?:\/\//i.test(value)) {
                try { const url = new URL(value); return [key, `${url.origin}${url.pathname}`]; } catch {}
              }
              return [key, value];
            }));

          const beforeConfig = await readConfig();
          const beforeBody = String(beforeConfig.mailer_templates_recovery_content || '');
          const beforeSubject = String(beforeConfig.mailer_subjects_recovery || '');
          const before = {
            subject: beforeSubject,
            body: beforeBody,
            body_sha256: sha(beforeBody),
            body_bytes: Buffer.byteLength(beforeBody),
            has_dark_marker: beforeBody.includes('background-color:#0a0b0d') || beforeBody.includes('background:#0a0b0d'),
            has_logo_marker: beforeBody.includes('/brand-assets/kova-logo.png'),
            has_confirmation_url: beforeBody.includes('{{ .ConfirmationURL }}'),
            send_email_hooks: hookSummary(beforeConfig),
          };
          const target = {
            subject: process.env.TARGET_SUBJECT,
            body,
            body_sha256: sha(body),
            body_bytes: Buffer.byteLength(body),
          };
          const evidence = { project_ref: projectRef, captured_at: new Date().toISOString(), before, target };
          fs.writeFileSync('/tmp/recovery-template-evidence.json', JSON.stringify(evidence, null, 2));
          console.log(`BEFORE_SUBJECT=${before.subject}`);
          console.log(`BEFORE_BODY_SHA256=${before.body_sha256}`);
          console.log(`BEFORE_BODY_BYTES=${before.body_bytes}`);
          console.log(`BEFORE_HAS_DARK_MARKER=${before.has_dark_marker}`);
          console.log(`BEFORE_HAS_LOGO_MARKER=${before.has_logo_marker}`);
          console.log(`BEFORE_HAS_CONFIRMATION_URL=${before.has_confirmation_url}`);
          console.log(`SEND_EMAIL_HOOK_SUMMARY=${JSON.stringify(before.send_email_hooks)}`);
          console.log(`BEFORE_MATCHES_TARGET=${before.subject === target.subject && before.body === target.body}`);

          const patchResponse = await fetch(endpoint, {
            method: 'PATCH',
            headers: { ...managementHeaders, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mailer_subjects_recovery: target.subject,
              mailer_templates_recovery_content: target.body,
            }),
          });
          if (!patchResponse.ok) throw new Error(`Auth config PATCH failed: ${patchResponse.status} ${await patchResponse.text()}`);

          const afterConfig = await readConfig();
          const afterSubject = String(afterConfig.mailer_subjects_recovery || '');
          const afterBody = String(afterConfig.mailer_templates_recovery_content || '');
          if (afterSubject !== target.subject || afterBody !== target.body) throw new Error('recovery fields did not persist byte-for-byte');
          evidence.after = {
            subject: afterSubject,
            body: afterBody,
            body_sha256: sha(afterBody),
            body_bytes: Buffer.byteLength(afterBody),
            matches_target: true,
            verified_at: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/recovery-template-evidence.json', JSON.stringify(evidence, null, 2));
          console.log(`AFTER_SUBJECT=${afterSubject}`);
          console.log(`AFTER_BODY_SHA256=${evidence.after.body_sha256}`);
          console.log('AFTER_MATCHES_TARGET=true');

          const recoverUrl = `https://${projectRef}.supabase.co/auth/v1/recover?redirect_to=${encodeURIComponent(process.env.TARGET_REDIRECT_TO)}`;
          const send = () => fetch(recoverUrl, {
            method: 'POST',
            headers: {
              apikey: publishableKey,
              Authorization: `Bearer ${publishableKey}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: process.env.TARGET_EMAIL }),
          });
          let sendResponse = await send();
          if (sendResponse.status === 429) {
            console.log('RECOVERY_COOLDOWN_RETRY=45s');
            await sleep(45000);
            sendResponse = await send();
          }
          const sendText = await sendResponse.text();
          if (!sendResponse.ok) throw new Error(`recovery send failed: ${sendResponse.status} ${sendText}`);
          console.log(`RECOVERY_HTTP=${sendResponse.status}`);

          await sleep(20000);
          const stableConfig = await readConfig();
          if (String(stableConfig.mailer_subjects_recovery || '') !== target.subject || String(stableConfig.mailer_templates_recovery_content || '') !== target.body) {
            throw new Error('an automation overwrote the recovery fields after the test send');
          }
          evidence.test = {
            requested_at: new Date(Date.now() - 20000).toISOString(),
            checked_at: new Date().toISOString(),
            recipient: process.env.TARGET_EMAIL,
            redirect_to: process.env.TARGET_REDIRECT_TO,
            recovery_http_status: sendResponse.status,
            active_config_still_matches_target: true,
          };
          fs.writeFileSync('/tmp/recovery-template-evidence.json', JSON.stringify(evidence, null, 2));
          console.log('POST_SEND_CONFIG_STABLE=true');
          NODE

      - name: Upload recovery-template evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supabase-recovery-template-evidence
          path: /tmp/recovery-template-evidence.json
          if-no-files-found: ignore
          retention-days: 7
