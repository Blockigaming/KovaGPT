name: Requested PR source snapshot
on:
  push:
    branches: [codex/issue-208-production-evidence]
    paths: [.github/workflows/pr390-source-once.yml]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive only the two inspected commits
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 9cffce383835626b019367da62908b57771b6430
          mkdir "$RUNNER_TEMP/requested-source"
          git archive --format=tar --output="$RUNNER_TEMP/requested-source/pr390.tar" 9cffce383835626b019367da62908b57771b6430
          git archive --format=tar --output="$RUNNER_TEMP/requested-source/pr394.tar" 4f07f77d40b8785a271ec7fa6e35c4b27314b32b
          printf '%s\n' 'pr390 9cffce383835626b019367da62908b57771b6430' 'pr394 4f07f77d40b8785a271ec7fa6e35c4b27314b32b' > "$RUNNER_TEMP/requested-source/COMMITS.txt"
          cd "$RUNNER_TEMP/requested-source"
          sha256sum pr390.tar pr394.tar > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: requested-pr-source-${{ github.sha }}
          path: ${{ runner.temp }}/requested-source/
          retention-days: 1
          if-no-files-found: error
