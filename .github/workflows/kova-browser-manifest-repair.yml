name: One-time Kova Browser Canonical Manifest Repair
on:
  push:
    branches:
      - feat/kova-xenon-neon-argon-migration
    paths:
      - .github/workflows/kova-browser-manifest-repair.yml
permissions:
  contents: write
jobs:
  manifest:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/feat/kova-xenon-neon-argon-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/kova-xenon-neon-argon-migration
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate checked-in schema evidence from exact SQL source
        run: |
          npm run release:manifest
          npm run release:schema
          node scripts/release/canonical-history-decision.mjs --check
      - name: Commit only regenerated source-derived artifacts
        run: |
          set -euo pipefail
          git add -- release-migrations.json database-contract.json
          if git diff --cached --quiet; then
            echo "No manifest update needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(db): regenerate canonical manifest for 15m browser idle migration'
          git push origin HEAD:refs/heads/feat/kova-xenon-neon-argon-migration
