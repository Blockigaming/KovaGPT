name: Temporary Email Worker Validation

on:
  push:
    branches:
      - codex/email-dispatch-worker-20260904

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/email-dispatch-worker-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx prettier --write
          package.json
          worker/package.json
          worker/src/email-dispatcher.mjs
          worker/src/email-worker.mjs
          worker/scripts/email-health-check.mjs
          src/routes/api/public/help-submit.ts
          tests/unit/email-worker.test.mjs
          tests/integration/email-worker-source.test.mjs
          docs/email-worker.md
      - run: node --check worker/src/email-dispatcher.mjs
      - run: node --check worker/src/email-worker.mjs
      - run: node --test tests/unit/email-worker.test.mjs tests/integration/email-worker-source.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: docker build -f worker/Dockerfile.email -t kovagpt-email-worker:test .
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             package.json             worker/package.json             worker/src/email-dispatcher.mjs             worker/src/email-worker.mjs             worker/scripts/email-health-check.mjs             src/routes/api/public/help-submit.ts             tests/unit/email-worker.test.mjs             tests/integration/email-worker-source.test.mjs             docs/email-worker.md
          git commit -m "chore(email): format worker sources"
          git push origin HEAD:codex/email-dispatch-worker-20260904
