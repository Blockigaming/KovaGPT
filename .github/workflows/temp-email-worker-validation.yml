name: Temporary Email Worker Validation

on:
  push:
    branches:
      - codex/email-dispatch-worker-20260904

permissions:
  contents: write

concurrency:
  group: temporary-email-worker-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/email-dispatch-worker-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx prettier --write
          package.json
          worker/package.json
          worker/src/email-dispatcher.mjs
          worker/src/email-worker.mjs
          worker/scripts/email-health-check.mjs
          src/components/ShareChatDialog.tsx
          'src/routes/projects.$projectId.tsx'
          src/lib/email-queue.server.ts
          src/lib/email-templates/registry.ts
          src/lib/email-templates/project-invite.tsx
          src/lib/email-templates/shared-chat.tsx
          src/lib/project-invites.functions.ts
          src/lib/readiness.server.ts
          src/lib/resend-webhook.mjs
          src/lib/resend-webhook.d.ts
          src/lib/shared-chats.functions.ts
          src/routes/api/public/help-submit.ts
          src/routes/api/public/email/webhook.ts
          tests/unit/email-brand-system.test.mjs
          tests/unit/email-worker.test.mjs
          tests/unit/project-invite-security.test.mjs
          tests/unit/resend-webhook.test.mjs
          tests/unit/review-findings.test.mjs
          tests/api/help-submit-security.test.mjs
          tests/integration/email-worker-source.test.mjs
          docs/email-worker.md
      - run: node --check worker/src/email-dispatcher.mjs
      - run: node --check worker/src/email-worker.mjs
      - run: node --check src/lib/resend-webhook.mjs
      - run: >-
          node --test
          tests/unit/email-brand-system.test.mjs
          tests/unit/email-worker.test.mjs
          tests/unit/project-invite-security.test.mjs
          tests/unit/resend-webhook.test.mjs
          tests/unit/review-findings.test.mjs
          tests/api/help-submit-security.test.mjs
          tests/integration/email-worker-source.test.mjs
      - run: npm run release:manifest
      - run: npm run release:schema
      - run: npx vite build
      - run: npm run lint
      - run: npm run typecheck
      - run: docker build -f worker/Dockerfile.email -t kovagpt-email-worker:test .
      - name: Commit formatting and generated contracts
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            package.json \
            worker/package.json \
            worker/src/email-dispatcher.mjs \
            worker/src/email-worker.mjs \
            worker/scripts/email-health-check.mjs \
            src/components/ShareChatDialog.tsx \
            'src/routes/projects.$projectId.tsx' \
            src/lib/email-queue.server.ts \
            src/lib/email-templates/registry.ts \
            src/lib/email-templates/project-invite.tsx \
            src/lib/email-templates/shared-chat.tsx \
            src/lib/project-invites.functions.ts \
            src/lib/readiness.server.ts \
            src/lib/resend-webhook.mjs \
            src/lib/resend-webhook.d.ts \
            src/lib/shared-chats.functions.ts \
            src/routes/api/public/help-submit.ts \
            src/routes/api/public/email/webhook.ts \
            src/routeTree.gen.ts \
            tests/unit/email-brand-system.test.mjs \
            tests/unit/email-worker.test.mjs \
            tests/unit/project-invite-security.test.mjs \
            tests/unit/resend-webhook.test.mjs \
            tests/unit/review-findings.test.mjs \
            tests/api/help-submit-security.test.mjs \
            tests/integration/email-worker-source.test.mjs \
            docs/email-worker.md \
            release-migrations.json \
            database-contract.json
          git commit -m "chore(email): format and refresh generated contracts"
          git push origin HEAD:codex/email-dispatch-worker-20260904

  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/email-dispatch-worker-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:db:isolated
