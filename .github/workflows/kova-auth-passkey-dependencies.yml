name: Kova Passkey Dependency Preparation

on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-passkey-dependencies.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8d97a9e88262a93cfab47d7b5cd3b16a978c0e08
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Prepare exact-version dependencies for isolated validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8d97a9e88262a93cfab47d7b5cd3b16a978c0e08
          test -z "$(git status --porcelain)"
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund @simplewebauthn/server@14.0.2 @simplewebauthn/browser@14
          npm ci --ignore-scripts --no-audit --no-fund
          evidence="$RUNNER_TEMP/kova-passkey-dependencies"
          mkdir -p "$evidence"
          node --input-type=module - "$evidence" <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const root = process.argv[2];
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json']));
          const after = JSON.parse(readFileSync('package-lock.json'));
          const packageJson = JSON.parse(readFileSync('package.json'));
          assert.equal(packageJson.dependencies['@simplewebauthn/server'], '14.0.2');
          assert.match(packageJson.dependencies['@simplewebauthn/browser'], /^14\.\d+\.\d+$/);
          const paths = Object.keys(after.packages).filter(path => path &&
            JSON.stringify(before.packages[path]) !== JSON.stringify(after.packages[path]));
          for (const path of paths) assert.match(path, /^node_modules\/(?:@[^/]+\/)?[^/]+(?:\/node_modules\/(?:@[^/]+\/)?[^/]+)*$/);
          writeFileSync(root + '/modules.txt', paths.filter(existsSync).join('\n') + '\n');
          writeFileSync(root + '/package.json', readFileSync('package.json'));
          writeFileSync(root + '/package-lock.json', readFileSync('package-lock.json'));
          writeFileSync(root + '/package.patch', execFileSync('git', ['diff', '--binary', '--', 'package.json', 'package-lock.json']));
          writeFileSync(root + '/base.txt', execFileSync('git', ['rev-parse', 'HEAD']));
          JS
          tar -czf "$evidence/modules.tar.gz" -T "$evidence/modules.txt"
          test "$(stat -c %s "$evidence/modules.tar.gz")" -le 104857600
          cd "$evidence"
          sha256sum base.txt package.json package-lock.json package.patch modules.txt modules.tar.gz > SHA256SUMS

      - name: Upload dependency evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kova-passkey-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}/kova-passkey-dependencies/
          if-no-files-found: error
          retention-days: 1
