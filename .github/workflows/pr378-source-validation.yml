name: PR378 validate and refresh
on:
  push:
    branches: [codex/fix-high-priority-bugs-from-codex-review-l6puqo]
    paths: [.github/workflows/pr378-source-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format
        run: node node_modules/prettier/bin/prettier.cjs --write src/lib/chat-history-state.mjs tests/unit/chat-history-sync.test.mjs scripts/release/apply-chatgpt-parity-source.mjs tests/unit/chatgpt-parity-source.test.mjs src/components/auth/ClerkSafe.tsx tests/integration/principal-storage-lifecycle-source.test.mjs
      - name: Refresh ledger
        run: |
          node scripts/release/acceptance-ledger.mjs --write
          node scripts/release/acceptance-ledger.mjs --check
      - name: Targeted validation
        run: |
          node --test tests/unit/chat-history-sync.test.mjs tests/unit/chatgpt-parity-source.test.mjs tests/integration/principal-storage-lifecycle-source.test.mjs tests/unit/acceptance-ledger.test.mjs
          node scripts/release/apply-chatgpt-parity-source.mjs --check
          git diff --check
      - name: Commit and self-remove
        run: |
          rm .github/workflows/pr378-source-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/chat-history-state.mjs tests/unit/chat-history-sync.test.mjs scripts/release/apply-chatgpt-parity-source.mjs tests/unit/chatgpt-parity-source.test.mjs src/components/auth/ClerkSafe.tsx tests/integration/principal-storage-lifecycle-source.test.mjs docs/release/acceptance-ledger.generated.json .github/workflows/pr378-source-validation.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: validate PR 378 regression fixes"
          git push origin HEAD:"$GITHUB_REF_NAME"
