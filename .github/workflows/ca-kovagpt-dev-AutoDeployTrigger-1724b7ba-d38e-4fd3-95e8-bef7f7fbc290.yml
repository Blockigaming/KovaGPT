name: Deploy KovaGPT to Azure Container Apps

# Deployment is deliberately manual. The prior push trigger spent hosted-runner
# minutes on every main update even while the OIDC principal lacked ACR push
# access. Re-enable automation only after a reviewed release policy and a proven
# registry permission preflight exist.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Confirm that CI is green and the OIDC principal has AcrPush on kovagptacr
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: ca-kovagpt-dev
  cancel-in-progress: true

env:
  AZURE_CORE_OUTPUT: none
  ACR_NAME: kovagptacr
  ACR_LOGIN_SERVER: kovagptacr.azurecr.io
  CONTAINER_APP_NAME: ca-kovagpt-dev
  RESOURCE_GROUP: rg-kovagpt-dev
  IMAGE_NAME: kovagpt-web

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CAKOVAGPTDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAKOVAGPTDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAKOVAGPTDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Verify ACR push access before building
        shell: bash
        run: |
          set -euo pipefail
          if ! az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            --output tsv \
            --only-show-errors >/dev/null; then
            echo "::error::The GitHub OIDC service principal cannot obtain an ACR access token."
            echo "Grant AcrPush at the registry scope before starting another deployment."
            echo "Use scripts/azure/grant-acr-push.sh from an authorized Azure shell."
            exit 1
          fi

      - name: Build, push, and deploy container image
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: ${{ env.ACR_NAME }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          disableTelemetry: true

      - name: Verify Azure health endpoint
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          if [ -z "$fqdn" ]; then
            echo "Container Apps did not return an ingress FQDN."
            exit 1
          fi

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "https://${fqdn}/api/health"; then
              echo
              echo "Azure health check passed."
              exit 0
            fi

            echo "Health check attempt ${attempt}/30 failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Azure health check failed after 30 attempts."
          exit 1
