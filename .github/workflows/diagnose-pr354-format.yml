name: Diagnose PR 354 formatting

on:
  pull_request:
    paths:
      - scripts/release/migration-schema-proof-plan.mjs
      - tests/unit/migration-schema-proof-plan.test.mjs
      - .github/workflows/diagnose-pr354-format.yml

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            scripts/release/migration-schema-proof-plan.mjs \
            tests/unit/migration-schema-proof-plan.test.mjs
          git --no-pager diff -- \
            scripts/release/migration-schema-proof-plan.mjs \
            tests/unit/migration-schema-proof-plan.test.mjs
