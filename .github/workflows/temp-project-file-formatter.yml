name: Temporary Project File Formatter

on:
  push:
    branches:
      - codex/project-file-security-20260904

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/project-file-security-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx prettier --write
          src/routes/api/project-files.ts
          src/lib/project-workspace.functions.ts
          tests/integration/project-file-security-source.test.mjs
      - name: Commit
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/project-files.ts src/lib/project-workspace.functions.ts tests/integration/project-file-security-source.test.mjs
          git commit -m "chore(project-files): format integrity fixes"
          git push origin HEAD:codex/project-file-security-20260904
