name: M18 retained archive verification only

# REVIEW COPY ONLY. Publish only after the owner's exact execution approval.
# An isolated branch tip must contain only this workflow and its verifier/tests.
on:
  push:
    branches: [codex/m18-secret-source-proof-20261003]

permissions:
  contents: read

concurrency:
  group: m18-retained-secret-proof-20261003
  cancel-in-progress: false

jobs:
  verification-only:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/m18-secret-source-proof-20261003' && github.run_attempt == 1
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check reviewed verifier and non-secret prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_DEBUG:-}" != 1 ]]
          printf '%s  %s\n' '9cc202a39efc4bdac96787d5003a01ff74e382e344fc6062f94867acd1bc8d5c' verify_retained_backup.py | sha256sum --check --strict --status
          python3 -B -m unittest -v test_verify_retained_backup.py
          command -v gpg >/dev/null
          command -v gpgconf >/dev/null
          command -v unshare >/dev/null
          sudo -n unshare --net python3 -I -S -c 'from pathlib import Path; assert {r.split(":",1)[0].strip() for r in Path("/proc/self/net/dev").read_text().splitlines()[2:] if ":" in r} == {"lo"}'

      - name: Reconstruct only the retained hash-pinned encrypted ZIP
        shell: bash
        env:
          M18_ZIP_PART1: ${{ secrets.M18_RETAINED_ZIP_PART1_20261003 }}
          M18_ZIP_PART2: ${{ secrets.M18_RETAINED_ZIP_PART2_20261003 }}
          M18_ZIP_PART3: ${{ secrets.M18_RETAINED_ZIP_PART3_20261003 }}
          M18_ZIP_PART4: ${{ secrets.M18_RETAINED_ZIP_PART4_20261003 }}
          M18_ZIP_PART5: ${{ secrets.M18_RETAINED_ZIP_PART5_20261003 }}
          M18_ZIP_PART6: ${{ secrets.M18_RETAINED_ZIP_PART6_20261003 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 -I -S - <<'PY'
          import base64, hashlib, os, pathlib, sys
          try:
              parts = [os.environ.pop('M18_ZIP_PART'+str(i), '') for i in range(1,7)]
              assert list(map(len, parts)) == [32000,32000,32000,32000,32000,30388]
              raw = base64.b85decode(''.join(parts).encode('ascii'))
              del parts
              assert len(raw) == 152310
              assert hashlib.sha256(raw).hexdigest() == 'de65e0334bdfa1a2046c46dc36f52756956da65116386eb255d73d8ecd4bf4eb'
              folder = pathlib.Path(os.environ['RUNNER_TEMP'])/'m18-retained-input'
              folder.mkdir(mode=0o700)
              with (folder/'input.zip').open('xb') as out:
                  out.write(raw)
              del raw
          except BaseException:
              print('{"status":"FAIL","stage":"encrypted_input","secretUsed":false}')
              sys.exit(1)
          PY
          unset M18_ZIP_PART1 M18_ZIP_PART2 M18_ZIP_PART3 M18_ZIP_PART4 M18_ZIP_PART5 M18_ZIP_PART6

      - name: Verify with the original environment secret and no network
        shell: bash
        env:
          M18_DECRYPT_SECRET: ${{ secrets.KOVA_PRODUCTION_BACKUP_PASSPHRASE_20260926 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          [[ -n "${M18_DECRYPT_SECRET:-}" ]] || {
            echo '{"status":"FAIL","stage":"missing_environment_secret"}'
            exit 1
          }
          result=0
          printf '%s' "$M18_DECRYPT_SECRET" | env -u M18_DECRYPT_SECRET sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT,RUNNER_DEBUG unshare --net python3 -I -S "$GITHUB_WORKSPACE/verify_retained_backup.py" "$RUNNER_TEMP/m18-retained-input/input.zip" || result=$?
          unset M18_DECRYPT_SECRET
          exit "$result"

      - name: Remove operation input
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/m18-retained-input"
          [[ ! -e "$RUNNER_TEMP/m18-retained-input" ]]
