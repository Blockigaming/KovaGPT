name: Correct staging browser public config once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/remove-runtime-vite-staging-config-once.yml
      - infra/azure/staging/main.bicep
      - scripts/azure/validate-staging-template.mjs
      - tests/unit/azure-staging-template.test.mjs
      - docs/azure-staging-deployment.md
      - docs/azure-staging-validation-status.md

permissions:
  contents: write
  pull-requests: read

jobs:
  correct:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'infra/azure-low-cost-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out infrastructure branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: infra/azure-low-cost-staging
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove misleading runtime Vite variables and update guardrails
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          function read(path) {
            return fs.readFileSync(path, "utf8");
          }
          function write(path, value) {
            fs.writeFileSync(path, value);
          }
          function replaceOnce(path, before, after) {
            const source = read(path);
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`${path}: expected unique text not found`);
            }
            write(path, source.slice(0, first) + after + source.slice(first + before.length));
          }

          replaceOnce(
            "infra/azure/staging/main.bicep",
            "@description('Immutable ACR image reference. Supply repository@sha256:digest, never a mutable tag.')",
            "@description('Immutable ACR image reference built and verified with the synthetic staging browser Supabase configuration. Supply repository@sha256:digest, never a mutable tag.')",
          );
          replaceOnce(
            "infra/azure/staging/main.bicep",
            "            {\n              name: 'VITE_SUPABASE_URL'\n              value: supabaseUrl\n            }\n",
            "",
          );
          replaceOnce(
            "infra/azure/staging/main.bicep",
            "            {\n              name: 'VITE_SUPABASE_PUBLISHABLE_KEY'\n              value: supabasePublishableKey\n            }\n",
            "",
          );

          const validatorPath = "scripts/azure/validate-staging-template.mjs";
          replaceOnce(
            validatorPath,
            "  rejectMatch(\n    template,\n    /SUPABASE_SERVICE_ROLE_KEY'\\s*\\n\\s*value:/u,\n    \"service-role key cannot be a literal env value\",\n  );\n",
            `  rejectMatch(
            template,
            /SUPABASE_SERVICE_ROLE_KEY'\\s*\\n\\s*value:/u,
            "service-role key cannot be a literal env value",
          );
          rejectMatch(
            template,
            /name: 'VITE_SUPABASE_(?:URL|PUBLISHABLE_KEY)'/u,
            "runtime Vite variables cannot prove browser bundle configuration",
          );
          requireMatch(
            template,
            /image reference built and verified with the synthetic staging browser Supabase configuration/iu,
            "image provenance must require verified browser public configuration",
          );
`,
          );

          const testPath = "tests/unit/azure-staging-template.test.mjs";
          replaceOnce(
            testPath,
            "  assert.doesNotMatch(template, /value: openAiSecretUri|value: supabaseServiceRoleSecretUri/u);\n",
            `  assert.doesNotMatch(template, /value: openAiSecretUri|value: supabaseServiceRoleSecretUri/u);
          assert.doesNotMatch(template, /name: 'VITE_SUPABASE_(?:URL|PUBLISHABLE_KEY)'/u);
          assert.match(
            template,
            /image reference built and verified with the synthetic staging browser Supabase configuration/iu,
          );
`,
          );

          const docPath = "docs/azure-staging-deployment.md";
          replaceOnce(
            docPath,
            "- immutable `repository@sha256:digest` image input;\n",
            "- immutable `repository@sha256:digest` image input that was built and verified against the synthetic staging browser Supabase configuration;\n",
          );
          replaceOnce(
            docPath,
            "Required inputs:\n\n- exact immutable ACR image reference in `repository@sha256:<64 hex>` form;\n",
            `Required inputs:

- exact immutable ACR image reference in \`repository@sha256:<64 hex>\` form;
- build provenance proving that image's browser bundle was compiled with the same synthetic staging Supabase URL and publishable key supplied to the server runtime;
`,
          );
          replaceOnce(
            docPath,
            "Do not use the real production Supabase project or the disposable Auth rehearsal project as general application staging.\n",
            `Do not use the real production Supabase project or the disposable Auth rehearsal project as general application staging.

Do not treat Container App runtime \`VITE_SUPABASE_*\` values as a browser configuration mechanism. Vite replaces those values during the image build. The template intentionally omits runtime \`VITE_*\` variables. Until issue #164 implements a verified runtime public-config path, the supplied immutable image must already contain the synthetic browser configuration and must be scanned before deployment.
`,
          );

          const statusPath = "docs/azure-staging-validation-status.md";
          replaceOnce(
            statusPath,
            "- The net PR contains only the five reviewed infrastructure, validation, test, and documentation files.\n",
            "- The net PR contains only the reviewed infrastructure, validation, test, and documentation files.\n- Runtime `VITE_SUPABASE_*` entries are prohibited because they cannot retarget an already-built Vite browser bundle.\n- Issue #164 tracks the required build-time or runtime public-config solution.\n",
          );
          NODE

      - name: Format and validate corrected files
        run: |
          set -euo pipefail
          npx prettier --write \
            docs/azure-staging-deployment.md \
            docs/azure-staging-validation-status.md \
            scripts/azure/validate-staging-template.mjs \
            tests/unit/azure-staging-template.test.mjs
          node scripts/azure/validate-staging-template.mjs
          node --test tests/unit/azure-staging-template.test.mjs

      - name: Remove this one-shot workflow
        run: rm .github/workflows/remove-runtime-vite-staging-config-once.yml

      - name: Commit deterministic correction
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Require verified staging browser public config"
          git push origin HEAD:infra/azure-low-cost-staging
