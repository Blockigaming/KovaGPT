name: PR390 exact format

on:
  push:
    branches:
      - codex/issue-208-production-evidence
    paths:
      - .github/workflows/pr390-exact-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply repository Prettier exactly
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            scripts/release/zero-lovable-production.mjs \
            tests/unit/zero-lovable-production-evidence.test.mjs
          rm .github/workflows/pr390-exact-format.yml
          git diff --check

      - name: Commit exact formatting and remove formatter workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release/zero-lovable-production.mjs \
            tests/unit/zero-lovable-production-evidence.test.mjs \
            .github/workflows/pr390-exact-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: apply exact Prettier output"
          git push origin HEAD:"$GITHUB_REF_NAME"
