name: Format Auth rehearsal files (temporary)

on:
  push:
    branches:
      - fix/auth-rehearsal-safe-diagnostics
    paths:
      - .github/workflows/format-auth-rehearsal-temporary.yml
      - src/lib/auth-migration-rehearsal-db-adapter.server.mjs
      - tests/unit/auth-migration-rehearsal-db-adapter.test.mjs
      - tests/unit/auth-migration-rehearsal-diagnostics.test.mjs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated Auth rehearsal branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/auth-rehearsal-safe-diagnostics
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only Auth rehearsal files
        run: |
          npx --no-install prettier --write \
            src/lib/auth-migration-rehearsal-db-adapter.server.mjs \
            tests/unit/auth-migration-rehearsal-db-adapter.test.mjs \
            tests/unit/auth-migration-rehearsal-diagnostics.test.mjs

      - name: Verify exact formatting
        run: |
          npx --no-install prettier --check \
            src/lib/auth-migration-rehearsal-db-adapter.server.mjs \
            tests/unit/auth-migration-rehearsal-db-adapter.test.mjs \
            tests/unit/auth-migration-rehearsal-diagnostics.test.mjs

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            src/lib/auth-migration-rehearsal-db-adapter.server.mjs \
            tests/unit/auth-migration-rehearsal-db-adapter.test.mjs \
            tests/unit/auth-migration-rehearsal-diagnostics.test.mjs

          if git diff --cached --quiet; then
            echo "The selected files were already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format Auth rehearsal files [skip ci]"
          git push origin HEAD:fix/auth-rehearsal-safe-diagnostics
