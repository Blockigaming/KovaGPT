name: KovaGPT production promotion guard
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        { description: "Approved staging rehearsal run ID", required: true, type: string }
permissions: { contents: read, actions: read }
concurrency: { group: production-promotion, cancel-in-progress: false }
jobs:
  verify-only:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download immutable staging evidence
        run: gh run download "${{ inputs.staging_run_id }}" --name staging-release-candidate --dir artifacts/release
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Verify approved immutable staging report
        run: npm run release:production-guard
        env:
          KOVA_APPROVED_LAUNCH_REPORT: artifacts/release/launch-report.json
          KOVA_APPROVED_LAUNCH_REPORT_SHA256: ${{ secrets.APPROVED_LAUNCH_REPORT_SHA256 }}
          KOVA_PRODUCTION_HUMAN_APPROVAL: ${{ vars.PRODUCTION_HUMAN_APPROVAL }}
      - run: echo "Guard passed. This workflow intentionally performs no deployment or traffic shift."
