name: Desktop to mobile ratio audit

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/interface-ratio-audit.yml
      - playwright.interface-ratio.config.ts
      - tests/interface-ratio/**
      - src/components/HomeChat*.tsx
      - src/components/ChatInput.tsx
      - src/components/Sidebar.tsx
      - src/components/ChatHistorySync.tsx
      - src/components/SettingsDialog.tsx
      - src/components/auth/ClerkSafe.tsx
      - src/routes/__root.tsx
      - src/routes/index.tsx
      - src/styles/app-finish.css
      - src/styles/phone-layout.css
      - src/styles/phone-equivalence.css
      - src/styles/settings-reference.css
      - src/styles.css
      - tests/e2e/mobile-shell-ui-truth.spec.ts
      - tests/e2e/ui-quality.spec.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-ratio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KOVA_BROWSER_PREVIEW: node
      AI_GENERATION_ENABLED: "false"
      KOVA_GENERATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check responsive source formatting
        run: npx --no-install prettier --check .github/workflows/interface-ratio-audit.yml playwright.interface-ratio.config.ts tests/interface-ratio/ tests/e2e/mobile-shell-ui-truth.spec.ts src/styles/phone-equivalence.css src/styles.css docs/design/desktop-mobile-ratios.md
      - name: Build the isolated application
        id: build
        run: npm run build:azure
      - name: Install the pinned browser
        run: bash scripts/ci/install-playwright-browsers.sh chromium
      - name: Capture and verify the home startup frames
        run: >-
          npx --no-install playwright test --config=playwright.interface-ratio.config.ts
          startup.spec.ts --output=test-results/home-startup
      - name: Preserve the startup review
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: home-startup-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/home-startup/
          if-no-files-found: error
          retention-days: 7
      - name: Verify desktop freeze and mobile relationships
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npx --no-install playwright test --config=playwright.interface-ratio.config.ts
          desktop-mobile.spec.ts rich-output.spec.ts mobile-states.spec.ts
      - name: Verify mobile navigation, overlays and keyboard reachability
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: PLAYWRIGHT_PREBUILT=1 npx --no-install playwright test tests/e2e/mobile-quality.spec.ts tests/e2e/mobile-shell-ui-truth.spec.ts --project=phone-320x700 --project=phone-390x844 --project=phone-430x932 --project=phone-landscape-844x390 --workers=2 --output=test-results/interface-ratio/mobile-behavior
      - name: Verify the initial composer quality contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: PLAYWRIGHT_PREBUILT=1 npx --no-install playwright test tests/e2e/ui-quality.spec.ts --grep="empty workspace remains contained" --project=phone-320x700 --project=phone-390x844 --workers=2 --output=test-results/interface-ratio/composer-quality
      - name: Verify remaining phone editors and management dialogs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          PLAYWRIGHT_PREBUILT=1 npx --no-install playwright test
          tests/e2e/projects-library-workspaces.spec.ts
          tests/e2e/settings-device-layout.spec.ts
          tests/e2e/workspace-delete-dialogs.spec.ts
          tests/e2e/chat-attachment-preview.spec.ts
          tests/e2e/scheduled-task-editor.spec.ts
          tests/e2e/workspace-select-controls.spec.ts
          tests/e2e/reference-composer-behavior.spec.ts
          tests/e2e/composer-requested-layout.spec.ts
          --project=phone-320x700 --project=phone-landscape-844x390
          --workers=2 --output=test-results/interface-ratio/mobile-editors
      - name: Record source revision
        if: always()
        run: |
          mkdir -p test-results/interface-ratio
          git rev-parse HEAD > test-results/interface-ratio/commit.txt
      - name: Preserve geometry and fixture screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interface-ratio-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/interface-ratio/
          if-no-files-found: error
          retention-days: 7

  mobile-states:
    name: Mobile combined states (${{ matrix.engine }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    env:
      KOVA_MOBILE_STATE_ENGINE: ${{ matrix.engine }}
      AI_GENERATION_ENABLED: "false"
      KOVA_GENERATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the isolated application
        run: npm run build:azure
      - name: Install the selected browser
        run: bash scripts/ci/install-playwright-browsers.sh "${{ matrix.engine }}"
      - name: Verify keyboard, rotation and reading preferences
        run: >-
          npx --no-install playwright test --config=playwright.interface-ratio.config.ts
          --project=phone-320 --project=phone-390 --project=landscape-844 --project=tablet-768
      - name: Record source revision
        if: always()
        run: |
          mkdir -p test-results/interface-ratio
          git rev-parse HEAD > test-results/interface-ratio/commit.txt
      - name: Preserve mobile state evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-states-${{ matrix.engine }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/interface-ratio/
          if-no-files-found: error
          retention-days: 7
