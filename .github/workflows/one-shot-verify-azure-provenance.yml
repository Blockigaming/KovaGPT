name: One-shot verify Azure provenance hardening

on:
  push:
    branches:
      - infra/verified-browser-image-provenance

permissions:
  contents: write

concurrency:
  group: one-shot-verify-azure-provenance
  cancel-in-progress: false

jobs:
  format-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: infra/verified-browser-image-provenance
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Exercise exact Git-archive source context
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/azure/prepare-verified-build-context.sh
          context="$RUNNER_TEMP/kova-provenance-context"
          scripts/azure/prepare-verified-build-context.sh "$context"
          test -f "$context/.kova-source-attestation.json"
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const value = JSON.parse(fs.readFileSync(path, "utf8"));
            if (value.schemaVersion !== 1 || value.context !== "git-archive") process.exit(1);
            if (!/^[a-f0-9]{40}$/.test(value.sourceSha)) process.exit(1);
            if (!/^[a-f0-9]{40}$/.test(value.sourceTree)) process.exit(1);
          ' "$context/.kova-source-attestation.json"

      - name: Apply canonical formatting
        run: >-
          npx prettier --write
          scripts/azure/verify-browser-config.mjs
          tests/unit/azure-browser-config-provenance.test.mjs

      - name: Run focused provenance tests
        run: node --test tests/unit/azure-browser-config-provenance.test.mjs

      - name: Typecheck, validate Azure contracts, and build
        run: |
          npm run typecheck
          npm run azure:validate
          npm run build

      - name: Commit verified formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-verify-azure-provenance.yml
          git add \
            scripts/azure/verify-browser-config.mjs \
            tests/unit/azure-browser-config-provenance.test.mjs
          git diff --cached --check
          git config user.name "KovaGPT release automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Verify Azure browser provenance hardening"
          git push origin HEAD:infra/verified-browser-image-provenance
