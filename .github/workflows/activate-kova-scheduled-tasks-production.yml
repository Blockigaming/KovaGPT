name: Activate KovaGPT scheduled-task execution in production

# Protected one-time activation. Azure itself supplies the every-minute
# schedule after activation; this workflow does not run every minute.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE to configure the existing Tasks job"
        type: string
        required: true
      image_reference:
        description: "Approved immutable production ACR image (registry/repository@sha256:...)"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: kova-production-scheduled-execution-activation
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ACTIVATE'
    environment:
      name: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURE_CORE_OUTPUT: none
      RESOURCE_GROUP: ${{ vars.KOVA_PRODUCTION_RESOURCE_GROUP }}
      ACR_SERVER: ${{ vars.KOVA_PRODUCTION_ACR_LOGIN_SERVER }}
      IMAGE_REPOSITORY: ${{ vars.KOVA_PRODUCTION_IMAGE_REPOSITORY }}
      IMAGE_REFERENCE: ${{ inputs.image_reference }}
      JOB_NAME: kovagpt-scheduled-execution

    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate pinned image and exact job target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RESOURCE_GROUP" && -n "$ACR_SERVER" && -n "$IMAGE_REPOSITORY" ]]
          [[ "$RESOURCE_GROUP" == "rg-kovagpt-prod" ]] || exit 1
          [[ "$ACR_SERVER" =~ ^[a-z0-9.-]+\.azurecr\.io$ ]] || exit 1
          [[ "$IMAGE_REPOSITORY" =~ ^[a-z0-9]+([./_-][a-z0-9]+)*$ ]] || exit 1
          [[ "$IMAGE_REFERENCE" == "$ACR_SERVER/$IMAGE_REPOSITORY@sha256:"* ]] || exit 1
          digest="${IMAGE_REFERENCE##*@sha256:}"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1

      - name: Sign in with protected production OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.KOVAGPTPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KOVAGPTPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KOVAGPTPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing job and secret references without reading values
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job show -n "$JOB_NAME" -g "$RESOURCE_GROUP" -o json --only-show-errors > "$RUNNER_TEMP/kova-task-job-before.json"
          node --input-type=module - "$RUNNER_TEMP/kova-task-job-before.json" <<'NODE'
          import fs from "node:fs";
          const j = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (j.name !== process.env.JOB_NAME || j.type !== "Microsoft.App/jobs")
            throw Error("production_job_identity_mismatch");
          const config = j.properties?.configuration;
          if (!["Manual", "Schedule"].includes(config?.triggerType))
            throw Error("unexpected_job_trigger");
          const containers = j.properties?.template?.containers || [];
          if (containers.length !== 1) throw Error("unexpected_job_container_count");
          const container = containers[0];
          const existingCommand = [...(container.command || []), ...(container.args || [])].join(" ");
          // Do not repurpose an existing job running a different workload.
          if (existingCommand && !/scheduled[-_]?(execution|task)|production-worker\.mjs/.test(existingCommand))
            throw Error("job_is_used_by_another_workload");
          const env = container.env || [];
          if (!env.some(e => ["SCHEDULED_TASK_SECRET", "CRON_SECRET"].includes(e.name) && e.secretRef && !e.value))
            throw Error("worker_missing_secret_reference");
          if (config.replicaTimeout && config.replicaTimeout > 600)
            throw Error("unexpected_worker_timeout");
          console.log("Existing production Tasks job and private secret reference verified.");
          NODE

      - name: Qualify candidate ACR image before replacing job template
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "${ACR_SERVER%%.*}" --only-show-errors >/dev/null
          docker pull "$IMAGE_REFERENCE" >/dev/null
          revision="$(docker image inspect "$IMAGE_REFERENCE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$revision" == "$GITHUB_SHA" ]] || {
            echo "::error::The immutable image does not correspond to this approved source revision."
            exit 1
          }
          test "$(docker run --rm --entrypoint test "$IMAGE_REFERENCE" -f /app/scripts/scheduled-tasks/production-worker.mjs >/dev/null 2>&1; echo $?)" = "0"

      - name: Update dedicated worker image and command
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job update -n "$JOB_NAME" -g "$RESOURCE_GROUP" \
            --image "$IMAGE_REFERENCE" \
            --command node \
            --args /app/scripts/scheduled-tasks/production-worker.mjs \
            --set-env-vars KOVA_SCHEDULED_TASK_ENDPOINT=https://kovagpt.com/api/internal/scheduled-execution \
            --only-show-errors --output none

      - name: Activate one-minute Azure UTC schedule
        shell: bash
        run: |
          set -euo pipefail
          id="$(az containerapp job show -n "$JOB_NAME" -g "$RESOURCE_GROUP" --query id -o tsv --only-show-errors)"
          [[ "$id" == *"/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$JOB_NAME" ]] || exit 1
          body='{"properties":{"configuration":{"triggerType":"Schedule","scheduleTriggerConfig":{"cronExpression":"* * * * *","parallelism":1,"replicaCompletionCount":1},"replicaRetryLimit":0,"replicaTimeout":120}}}'
          az rest --method PATCH --uri "https://management.azure.com${id}?api-version=2025-07-01" \
            --headers "Content-Type=application/json" --body "$body" --output none --only-show-errors

      - name: Verify schedule configuration (not execution success)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            az containerapp job show -n "$JOB_NAME" -g "$RESOURCE_GROUP" -o json --only-show-errors > "$RUNNER_TEMP/kova-task-job-after.json"
            if node --input-type=module - "$RUNNER_TEMP/kova-task-job-after.json" <<'NODE'
          import fs from "node:fs";
          const job=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const c=job.properties?.configuration;
          if(c?.triggerType!=="Schedule" || c.scheduleTriggerConfig?.cronExpression!=="* * * * *")
            process.exit(1);
          const container=job.properties.template.containers[0];
          if(container.image!==process.env.IMAGE_REFERENCE ||
             !(container.args || []).includes("/app/scripts/scheduled-tasks/production-worker.mjs"))
            process.exit(1);
          NODE
            then
              echo "One-minute scheduler configured; live heartbeat and task completion still require verification."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Scheduler configuration was not verified."
          exit 1
