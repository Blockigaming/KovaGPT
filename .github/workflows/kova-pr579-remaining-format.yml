name: Kova PR 579 remaining formatter
on:
  push:
    branches: [feat/kova-xenon-neon-argon-migration]
    paths: [.github/workflows/kova-pr579-remaining-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair four identified repository-wide formatting gaps
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --write \
            src/components/interactive-ui/InteractiveBlock.tsx \
            src/lib/interactive-ui.d.mts \
            src/lib/interactive-ui.mjs \
            tests/unit/interactive-ui.test.mjs
          git add -- \
            src/components/interactive-ui/InteractiveBlock.tsx \
            src/lib/interactive-ui.d.mts \
            src/lib/interactive-ui.mjs \
            tests/unit/interactive-ui.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "kova-ci-format"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "style: repair repository interactive-ui formatting"
          git push origin HEAD:refs/heads/feat/kova-xenon-neon-argon-migration
