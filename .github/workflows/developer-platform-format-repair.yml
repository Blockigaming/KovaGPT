name: Developer platform formatting repair
on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/developer-platform-format-repair.yml"
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.number == 779 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kova/developer-platform-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only files changed in this PR
        run: |
          git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD | xargs -0 npx --no-install prettier --write --ignore-unknown
          GITHUB_BASE_REF=main npm run format:check:changed
      - name: Export formatter patch
        run: |
          echo 'KOVA_FORMAT_PATCH_BEGIN'
          git diff --binary --no-ext-diff | base64 -w 120
          echo 'KOVA_FORMAT_PATCH_END'
