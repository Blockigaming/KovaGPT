name: Format PR 143 foundation once

on:
  push:
    branches:
      - program/azure-gpt56-foundation
    paths:
      - .github/workflows/format-pr143-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: program/azure-gpt56-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only PR 143 files
        run: >-
          npx prettier --write
          docs/azure-chatgpt-parity-program.md
          src/lib/ai/provider.server.ts

      - name: Remove this one-shot workflow
        run: rm .github/workflows/format-pr143-once.yml

      - name: Commit deterministic formatting
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Format Azure GPT-5.6 foundation"
          git push origin HEAD:program/azure-gpt56-foundation
