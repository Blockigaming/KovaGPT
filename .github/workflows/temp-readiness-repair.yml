name: Temporary Readiness Repair

on:
  push:
    branches:
      - codex/readiness-timeout-20260904

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/readiness-timeout-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/lib/fetch-with-timeout.ts src/lib/readiness-client.ts tests/unit/operational-states.test.mjs
      - run: node --test tests/unit/operational-states.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit repair
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fetch-with-timeout.ts src/lib/readiness-client.ts tests/unit/operational-states.test.mjs
          git commit -m "chore(readiness): format timeout repairs"
          git push origin HEAD:codex/readiness-timeout-20260904
