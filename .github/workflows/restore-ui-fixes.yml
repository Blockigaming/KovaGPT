name: restore-ui-fixes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-ui-fixes.yml
      - scripts/apply-ui-fixes.py
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ui/apps-working-health-thinking
          fetch-depth: 0
      - name: Apply UI fixes
        run: python3 scripts/apply-ui-fixes.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/apps.tsx src/components/ChatMessage.tsx src/lib/connectors-catalog.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore apps/ChatMessage with Plaid, logos, Working for Ns, no Skip"
            git push origin HEAD:ui/apps-working-health-thinking
          fi
