name: Kova Auth Tree Transfer

on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-tree-transfer.yml]

permissions: {}

jobs:
  transfer:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation' && github.event.before == 'a5c65c5291fbeb95c2112080659502c7f5783008'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only the pinned parent without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: a5c65c5291fbeb95c2112080659502c7f5783008
          fetch-depth: 1
          persist-credentials: false

      - name: Populate hash-pinned Git objects without moving any ref
        env:
          GIT_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Populate only hash-pinned Git objects; never commit, move refs, or deploy."""
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          import zlib
          
          REPOSITORY = "Blockigaming/KovaGPT"
          BRANCH = "refs/heads/codex/kova-owned-auth-foundation"
          BASE = "a5c65c5291fbeb95c2112080659502c7f5783008"
          BASE_TREE = "e63eb0d6fb0fd76323f34d5cf654d8a8e7e82a3f"
          TREE = "ae1c41226783a9e552ea1b987b2ace17ab1caf9c"
          PATCH_SHA256 = "80409e5145949f0eb361c2eb61dc155c62a25fc2288d06f7ad10c1d4f25055d9"
          PARTS = [
              ("f1b9c3aad8bfdcf7273ed5f71d1ae3492aaf271f", "77380c53a3fc27ee6867695da42a1958bada6476"),
              ("b960bda118243fc97a478b283f752911b8a1e90f", "b960bda118243fc97a478b283f752911b8a1e90f"),
              ("0ffead6409264b91c2265c0d5f3835db738bc301", "0ffead6409264b91c2265c0d5f3835db738bc301"),
              ("4a0a5f69e501186d9c615907889fb18c9f919906", "4a0a5f69e501186d9c615907889fb18c9f919906"),
              ("3a9b1a2ca6b3a91621be38f153cc60292086ce82", "3a9b1a2ca6b3a91621be38f153cc60292086ce82"),
          ]
          FILES = {
              ".github/workflows/kova-owned-auth-source.yml": "766f2a68cfd8b0923e7942c6149f0c903173084c",
              "database-contract.json": "9667787da476949be9a5e0e612d0b2905f5281aa",
              "docs/kova-owned-auth.md": "dc1b39ae76f87453ddd159808e7162084cc247ce",
              "release-migrations.json": "0fa990409fa335c4642cef0bc56ab09bbe85c90a",
              "src/components/MfaPanel.tsx": "7675d6aeefcdf54fb7bcdf128442b5e1db6e1757",
              "src/lib/api-auth.server.ts": "76ff5e72f20d47076c8a77b01572ffed49113dbe",
              "src/lib/kova-auth-browser.ts": "2eeb9452454527747aa32f84415f8acd43ac482b",
              "src/lib/kova-auth-http.server.ts": "17421c0c2c642651c981f8b4891fdd74f6983d22",
              "src/lib/kova-auth-store.server.ts": "6336f6c2c6f83a047fbaed5e5e505405d1f63946",
              "src/routeTree.gen.ts": "a4e931c585ee14331f1b14e98d1e3f51f32e5f1d",
              "src/routes/api/auth/mfa/recovery/regenerate.ts": "5956c47037256975edb1d6479139e8f42f186eeb",
              "src/routes/api/auth/sessions/revoke-others.ts": "f16f57ff9ad44067fba1757c1f029422bb96a0cd",
              "supabase/migrations/20260921160105_kova_owned_mfa_recovery_controls.sql": "40cc5f2f95cd2ede794c246c5d68e2f1ec90fe8c",
              "tests/integration/auth-account-security-source.test.mjs": "aac230a0983ee5c98432071c9b8b4203e99b6b0e",
              "tests/unit/kova-auth-cache-middleware.test.mjs": "d91b7de0cad632ddba2cce0df6b3b31d344cd452",
              "tests/unit/kova-auth-mfa-panel-runtime.test.mjs": "8eee32356fb172349288e249df71cac21204b6b8",
              "tests/unit/kova-auth-recovery-controls-http.test.mjs": "db5c52a202f92c249231506df147c6ffe8a8210a",
              "tests/unit/kova-owned-auth-database.test.mjs": "7e70bde5de9fcd0dc5575b8821bc6028b2ea5ebd",
              "tests/unit/upgrade-database-scheduled-catalog.test.mjs": "60c72f1b3ec5673789fb455c5367114188adf4f7",
              "tests/unit/upgrade-database-scheduled-tables.test.mjs": "d22949f46d1b8bbb59c3ec336fe1226f4b6014f2",
              "tests/unit/upgrade-database-temp-export-proof.test.mjs": "ba0005dac92ed16f540fbe15e8b2454b0a029d77",
              "tests/unit/upgrade-source-provenance.test.mjs": "cf9b5387ed4c22d051a484464c90a10561dd6755",
          }
          
          
          def git(*args, data=None):
              return subprocess.check_output(["git", *args], input=data)
          
          
          def blob_hash(value):
              return hashlib.sha1(b"blob " + str(len(value)).encode() + b"\0" + value).hexdigest()
          
          
          def api(method, path, body=None):
              allowed_read = path == "/git/ref/heads/codex/kova-owned-auth-foundation" or path in {
                  "/git/blobs/" + remote for remote, _ in PARTS
              }
              if not ((method == "GET" and allowed_read) or
                      (method == "POST" and path in ("/git/blobs", "/git/trees"))):
                  raise RuntimeError("Git operation outside object-transfer scope")
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPOSITORY + path,
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GIT_OBJECT_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(2_000_001)
              if len(raw) > 2_000_000:
                  raise RuntimeError("Oversized Git API response")
              return json.loads(raw)
          
          
          def main():
              assert os.environ["GITHUB_REPOSITORY"] == REPOSITORY
              assert os.environ["GITHUB_REF"] == BRANCH
              assert git("rev-parse", "HEAD").decode().strip() == BASE
              assert not git("status", "--porcelain")
              assert api("GET", "/git/ref/heads/codex/kova-owned-auth-foundation")["object"]["sha"] == os.environ["GITHUB_SHA"]
              compressed = bytearray()
              for remote, expected in PARTS:
                  item = api("GET", "/git/blobs/" + remote)
                  assert item["sha"] == remote and item["encoding"] == "base64"
                  raw = base64.b64decode("".join(item["content"].split()), validate=True)
                  assert len(raw) <= 7000 and blob_hash(raw) == remote
                  if remote != expected:
                      # Correct one independently reproduced base64 transcription byte;
                      # the expected original Git hash must match before using it.
                      encoded = base64.b64encode(raw).decode()
                      assert encoded.count("VgG1nhy2Wmx") == 1
                      raw = base64.b64decode(encoded.replace("VgG1nhy2Wmx", "VgG1nhy1Wmx"), validate=True)
                  assert blob_hash(raw) == expected
                  compressed.extend(raw)
              assert len(compressed) == 29093
              decoder = zlib.decompressobj()
              patch = decoder.decompress(compressed, 150000)
              assert decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
              assert len(patch) == 127236 and hashlib.sha256(patch).hexdigest() == PATCH_SHA256
          
              # Reconstruct objects in Git's index only: no source code is executed and
              # no working-tree files, commit, branch, database, or environment is changed.
              git("apply", "--cached", "--check", "--whitespace=error", data=patch)
              git("apply", "--cached", "--whitespace=error", data=patch)
              changed = git("diff", "--cached", "--name-only", "-z").decode().rstrip("\0").split("\0")
              assert sorted(changed) == sorted(FILES)
              assert git("write-tree").decode().strip() == TREE
              entries = []
              for path, expected in FILES.items():
                  stage = git("ls-files", "--stage", "--", path).decode()
                  assert stage.startswith("100644 " + expected + " 0\t")
                  content = git("cat-file", "blob", expected)
                  assert len(content) <= 256000 and blob_hash(content) == expected
                  created = api("POST", "/git/blobs", {
                      "encoding": "base64", "content": base64.b64encode(content).decode(),
                  })
                  assert created["sha"] == expected
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": expected})
                  print("VERIFIED_BLOB", path, expected, flush=True)
              created = api("POST", "/git/trees", {"base_tree": BASE_TREE, "tree": entries})
              assert created["sha"] == TREE
              print("VERIFIED_TREE=" + TREE, flush=True)
          
          
          if __name__ == "__main__":
              main()
          PY
