name: Repair PR 649 formatting
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/repair-pr649-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/finances-dashboard-preview-20261110
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/components/BankConnectionsPanel.tsx src/components/FinanceActivityDashboard.tsx src/components/HealthConnectionsPanel.tsx src/components/HealthDashboardPreview.tsx
      - name: Commit formatted files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BankConnectionsPanel.tsx src/components/FinanceActivityDashboard.tsx src/components/HealthConnectionsPanel.tsx src/components/HealthDashboardPreview.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix Prettier formatting for finance and health dashboards"
            git push origin HEAD:feature/finances-dashboard-preview-20261110
          fi
