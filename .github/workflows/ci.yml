name: KovaGPT CI

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting changed files
        run: npm run format:check:changed

      - name: Legacy repository formatting audit
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Release contracts
        run: npm run release:migrations && npm run release:manifest && npm run release:schema && npm run release:env && npm run release:security

      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks
        run: npm run test:a11y

      - name: Visual checks
        run: npm run test:visual

      - name: Browser smoke checks
        run: npm run test:browser

      - name: Release checks
        run: npm run release:bundle && npm run test:release

      - name: Clean tree check
        run: git diff --check

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-verify
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.id }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOVA_BROWSER_PREVIEW: "node"
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: phone
            projects: >-
              --project=phone-320x700 --project=phone-375x812 --project=phone-390x844 --project=phone-412x915 --project=phone-430x932
            shard: 1/1
          - id: tablet
            projects: >-
              --project=tablet-768x1024 --project=phone-landscape-844x390 --project=tablet-1024x768
            shard: 1/1
          - id: desktop-1280
            projects: --project=desktop-1280x800
            shard: 1/1
          - id: desktop-1440-a
            projects: --project=desktop-1440x900
            shard: 1/2
          - id: desktop-1440-b
            projects: --project=desktop-1440x900
            shard: 2/2
          - id: desktop-1728
            projects: --project=desktop-1728x1117
            shard: 1/1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Browser preview build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          PLAYWRIGHT_PREBUILT: "1"
        run: npm run test:e2e -- ${{ matrix.projects }} --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-${{ matrix.id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  release-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=blob
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error

  e2e-report:
    if: always()
    needs: release-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-blob-*
          path: blob-reports
          merge-multiple: true
      - name: Detect blob reports
        id: reports
        shell: bash
        run: |
          if find blob-reports -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Playwright blob reports were produced; skipping report merge."
          fi
      - name: Merge Playwright reports
        if: steps.reports.outputs.available == 'true'
        run: npx playwright merge-reports --reporter=html ./blob-reports
      - name: Upload merged Playwright report
        if: steps.reports.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merged-playwright-report
          path: playwright-report

  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:db:isolated
      - run: npm run release:schema && git diff --exit-code -- database-contract.json
