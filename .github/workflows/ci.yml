name: KovaGPT CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kova-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      run_database: ${{ steps.scope.outputs.run_database }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "run_database=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          printf '%s\n' "$files"

          # A single grep avoids SIGPIPE under pipefail on very large PRs. A
          # grep -q consumer can otherwise exit before its producer finishes
          # and incorrectly classify source changes as documentation-only.
          if grep -Eqv '^(docs/|artifacts/)|\.md$' <<< "$files"; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: expensive CI stages are not required."
          fi

          if grep -Eq '^(\.github/workflows/ci\.yml$|supabase/migrations/|tests/fixtures/production-migration-history-20260904/|database-contract\.json$|release-migration-lineage\.json$|release-migrations\.json$|scripts/release/(isolated-database|migration-preflight|migration-schema-fingerprint|migration-schema-proof-plan|migrations|schema-contract)\.mjs$|scripts/release/upgrade-database[^/]*\.(mjs|sql)$)' <<< "$files"; then
            echo "run_database=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_database=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.scope.outputs.run_ci == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run_ci == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting changed files
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run format:check:changed

      - name: Repository formatting audit
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run format:check

      - name: Lint
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run typecheck

      - name: Release contracts
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run release:migrations && npm run release:manifest && npm run release:schema && npm run release:env && npm run release:security && git diff --exit-code -- release-migrations.json database-contract.json

      - name: Dependency audit
        if: steps.scope.outputs.run_ci == 'true'
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if timeout --signal=TERM --kill-after=10s 210s npm audit --audit-level=high --omit=dev; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Dependency audit failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Dependency audit attempt ${attempt} failed; retrying."
            sleep "$((attempt * 5))"
          done

      - name: Unit tests
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run test:unit

      - name: API tests
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run test:api

      - name: Production build
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run build

      - name: Bundle budget
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run release:bundle

      - name: Install Playwright browsers
        if: steps.scope.outputs.run_ci == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Integration tests
        id: integration
        if: steps.scope.outputs.run_ci == 'true'
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run test:integration 2>&1 | tee artifacts/ci/integration-tests.log

      - name: Upload integration test log
        if: steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-log-${{ github.sha }}
          path: artifacts/ci/integration-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Read-only deployed baseline audit
        id: deployed_baseline
        if: steps.scope.outputs.run_ci == 'true'
        continue-on-error: true
        run: npm run test:deployed-baseline:audit

      - name: Report deployed baseline audit blocker
        if: steps.scope.outputs.run_ci == 'true' && steps.deployed_baseline.outcome == 'failure'
        run: echo "::warning::The observational deployed-baseline audit could not produce accepted evidence; strict candidate gates will continue."

      - name: Upload deployed baseline evidence
        if: always() && steps.deployed_baseline.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployed-baseline-${{ github.sha }}
          path: artifacts/ui-audit/deployed-baseline
          if-no-files-found: warn
          retention-days: 7

      - name: Accessibility checks
        if: steps.scope.outputs.run_ci == 'true'
        env:
          PLAYWRIGHT_PREBUILT: "1"
        run: npm run test:a11y

      - name: Visual checks
        id: candidate_visual
        if: steps.scope.outputs.run_ci == 'true'
        env:
          KOVA_CANDIDATE_VISUAL_EVIDENCE_DIR: artifacts/ui-audit/candidate-visual
          PLAYWRIGHT_PREBUILT: "1"
        run: npm run test:visual

      - name: Upload rendered candidate visual evidence
        if: always() && steps.candidate_visual.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-visual-${{ github.sha }}
          path: artifacts/ui-audit/candidate-visual/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Browser smoke checks
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run test:browser

      - name: Release checks
        if: steps.scope.outputs.run_ci == 'true'
        run: npm run test:release

      - name: Clean tree check
        if: steps.scope.outputs.run_ci == 'true'
        run: git diff --check

      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.run_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts-verify
          path: |
            test-results
            playwright-report
            tests/e2e/*-snapshots
          if-no-files-found: ignore

  public-surface:
    if: needs.verify.outputs.run_ci == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KOVA_BROWSER_PREVIEW: "node"
      KOVA_BROWSER_SUITE: "public"
      PLAYWRIGHT_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        project: [phone-390x844, tablet-1024x768, desktop-1440x900]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Complete public route and detail checks
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --reporter=list,blob --workers=2
      - name: Preserve public suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-blob-public-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error

  browser:
    if: always() && needs.verify.result == 'success' && needs.verify.outputs.run_ci == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Browser (${{ matrix.id }})
    needs: [verify, public-surface]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOVA_BROWSER_PREVIEW: "node"
      KOVA_BROWSER_SUITE: "core"
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: phone
            projects: >-
              --project=phone-320x700 --project=phone-375x812 --project=phone-390x844 --project=phone-412x915 --project=phone-430x932
            shard: 1/1
          - id: tablet
            projects: >-
              --project=tablet-768x1024 --project=phone-landscape-844x390 --project=tablet-1024x768
            shard: 1/1
          - id: desktop-1280
            projects: --project=desktop-1280x800
            shard: 1/1
          - id: desktop-1440-a
            projects: --project=desktop-1440x900
            shard: 1/2
          - id: desktop-1440-b
            projects: --project=desktop-1440x900
            shard: 2/2
          - id: desktop-1728
            projects: --project=desktop-1728x1117
            shard: 1/1
    steps:
      # Keep the existing required check names red if any public shard fails or is skipped.
      - name: Require complete public coverage
        env:
          PUBLIC_RESULT: ${{ needs.public-surface.result }}
        run: test "$PUBLIC_RESULT" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Browser preview build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          PLAYWRIGHT_PREBUILT: "1"
        run: npm run test:e2e -- ${{ matrix.projects }} --shard=${{ matrix.shard }} --workers=2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts-${{ matrix.id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  release-e2e:
    if: always() && needs.verify.result == 'success' && needs.verify.outputs.run_ci == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [verify, public-surface]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOVA_BROWSER_PREVIEW: "node"
      KOVA_BROWSER_SUITE: "core"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Keep the existing required check names red if any public shard fails or is skipped.
      - name: Require complete public coverage
        env:
          PUBLIC_RESULT: ${{ needs.public-surface.result }}
        run: test "$PUBLIC_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=blob --workers=2
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error

  e2e-report:
    if: always() && (needs.release-e2e.result == 'success' || needs.release-e2e.result == 'failure')
    needs: release-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Retry transport in a fresh directory: failed extraction may leave a
      # truncated ZIP. Never merge a partial set or treat missing reports as green.
      - name: Download complete blob reports (attempt 1)
        id: download_1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-blob-*
          path: blob-download-1
          merge-multiple: false
      - name: Download complete blob reports (attempt 2)
        id: download_2
        if: steps.download_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-blob-*
          path: blob-download-2
          merge-multiple: false
      - name: Download complete blob reports (attempt 3)
        id: download_3
        if: steps.download_2.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-blob-*
          path: blob-download-3
          merge-multiple: false
      - name: Validate complete reports before merge
        env:
          DOWNLOAD_1: ${{ steps.download_1.outcome }}
          DOWNLOAD_2: ${{ steps.download_2.outcome }}
          DOWNLOAD_3: ${{ steps.download_3.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          directory=""
          for attempt in 1 2 3; do
            variable="DOWNLOAD_${attempt}"
            if [[ "${!variable}" == success ]]; then directory="blob-download-${attempt}"; break; fi
          done
          test -n "$directory"
          python3 scripts/release/validate-playwright-reports.py "$directory" blob-reports
      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html ./blob-reports
      - name: Upload merged Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: merged-playwright-report
          path: playwright-report
          if-no-files-found: error

  isolated-database:
    needs: verify
    if: always() && needs.verify.result == 'success' && needs.verify.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:db:isolated
      - name: Rehearse upgrade from captured production history
        run: npm run release:db:upgrade
      - run: npm run release:schema && git diff --exit-code -- database-contract.json
      - name: Upload upgrade rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-upgrade-evidence
          path: artifacts/release/upgrade-*
          if-no-files-found: ignore
