name: KovaGPT CI

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - "codex/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting changed files
        run: npm run format:check:changed

      - name: Legacy repository formatting audit
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          PLAYWRIGHT_PREBUILT: "1"
        run: |
          npm run test:e2e -- --project=phone-320x700 --project=phone-375x812 --project=phone-390x844 --project=phone-412x915 --project=phone-430x932
          npm run test:e2e -- --project=tablet-768x1024 --project=phone-landscape-844x390 --project=tablet-1024x768
          npm run test:e2e -- --project=desktop-1280x800 --project=desktop-1440x900 --project=desktop-1728x1117

      - name: Accessibility checks
        run: npm run test:a11y

      - name: Visual checks
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
