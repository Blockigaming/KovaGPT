name: KovaGPT release gates
on:
  pull_request:
  push:
    branches: [main, work, "release/**", "codex/**"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@1e60f620b9541dcec8f7a90236bce6b204a1f5b
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Formatting changed files
        run: npm run format:check:changed
      - name: Legacy repository formatting audit
        continue-on-error: true
        run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run release:migrations
      - run: npm run release:manifest && npm run release:schema && git diff --exit-code -- release-migrations.json database-contract.json
      - run: npm run release:env
      - run: npm run release:security
      - run: npm audit --audit-level=high --omit=dev
      - run: git diff --check && test -z "$(git status --porcelain)"
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@1e60f620b9541dcec8f7a90236bce6b204a1f5b
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production build
        run: npm run build
      - run: npm run release:bundle
      - run: npm run test:unit && npm run test:integration && npm run test:api && npm run test:a11y && npm run test:visual && npm run test:release
      - run: KOVA_REPOSITORY_VALIDATED=1 npm run release:candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-contracts, path: artifacts/release }
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dcec8f7a90236bce6b204a1f5b
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: E2E shard ${{ matrix.shard }}/3
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=blob
      - if: failure()
        run: ps aux && df -h && find test-results -type f -printf '%s %p\n' | sort -nr | head -30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
  e2e-report:
    if: always()
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dcec8f7a90236bce6b204a1f5b
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: e2e-blob-*, path: blob-reports, merge-multiple: true }
      - run: npx playwright merge-reports --reporter=html ./blob-reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: merged-playwright-report, path: playwright-report }
  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dcec8f7a90236bce6b204a1f5b
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:db:isolated
      - run: npm run release:schema && git diff --exit-code -- database-contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: isolated-schema, path: artifacts/release/isolated-schema.sql }
