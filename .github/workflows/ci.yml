name: KovaGPT CI

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting changed files
        run: npm run format:check:changed

      - name: Legacy repository formatting audit
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks
        run: npm run test:a11y

      - name: Visual checks
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-verify
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.id }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOVA_BROWSER_PREVIEW: "node"
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: phone
            projects: >-
              --project=phone-320x700 --project=phone-375x812 --project=phone-390x844 --project=phone-412x915 --project=phone-430x932
            shard: 1/1
          - id: tablet
            projects: >-
              --project=tablet-768x1024 --project=phone-landscape-844x390 --project=tablet-1024x768
            shard: 1/1
          - id: desktop-1280
            projects: --project=desktop-1280x800
            shard: 1/1
          - id: desktop-1440-a
            projects: --project=desktop-1440x900
            shard: 1/2
          - id: desktop-1440-b
            projects: --project=desktop-1440x900
            shard: 2/2
          - id: desktop-1728
            projects: --project=desktop-1728x1117
            shard: 1/1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Browser preview build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          PLAYWRIGHT_PREBUILT: "1"
        run: npm run test:e2e -- ${{ matrix.projects }} --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-${{ matrix.id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
