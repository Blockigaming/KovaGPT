# Temporary exact-tree transfer for the already locally tested auth batch.
# Its final source commit removes this helper; it never updates refs itself.
name: Kova Auth Verified Source Objects
on:
  push:
    branches: [codex/kova-owned-auth-foundation]
    paths: [.github/workflows/kova-auth-verified-source-objects.yml]
permissions:
  contents: read
jobs:
  objects:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/kova-owned-auth-foundation' && github.actor == 'Blockigaming'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the exact temporary commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the patch and transfer only matching Git objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE_OBJECTS'
          import os, json, base64, lzma, hashlib, subprocess, pathlib, urllib.request
          BASE = "40e74b0a4fc0f5b2b220ff8f9fe178eaa9d89178"
          BASE_TREE = "811a0312d96236f917cdc0b354a2c40715e11f62"
          TARGET = "5cf54b93e3fdcd6c2f83748a8e176e59dbc87200"
          PATCH_HASH = "23016b0d9b85855ca169f58af717cb7ee7edd6ee370acc92c6d1b9888d84ae4c"
          PATCH_BLOB = "c04f69fa05c29412c61246ac738920933af3f53e"
          HELPER = ".github/workflows/kova-auth-verified-source-objects.yml"
          def git(*args):
              return subprocess.check_output(["git", *args]).strip()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("Redirect refused")
          def api(method, endpoint, body=None):
              assert (method, endpoint) in (("GET", "git/blobs/" + PATCH_BLOB), ("POST", "git/trees"))
              data = None if body is None else json.dumps(body).encode("utf-8")
              assert data is None or len(data) < 3000000
              request = urllib.request.Request(
                  "https://api.github.com/repos/Blockigaming/KovaGPT/" + endpoint,
                  data=data, method=method, headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=60) as response:
                  assert response.status == (200 if method == "GET" else 201)
                  return json.loads(response.read(3000000))
          assert os.environ["GITHUB_REPOSITORY"] == "Blockigaming/KovaGPT"
          assert os.environ["GITHUB_REF"] == "refs/heads/codex/kova-owned-auth-foundation"
          head = os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD").decode() == head
          assert git("rev-parse", "HEAD^").decode() == BASE
          assert git("diff", "--name-only", BASE, "HEAD").decode() == HELPER
          assert not git("status", "--porcelain")
          value = api("GET", "git/blobs/" + PATCH_BLOB)
          assert value["sha"] == PATCH_BLOB and value["encoding"] == "base64" and value["size"] == 21008
          compressed = base64.b64decode("".join(value["content"].split()), validate=True)
          assert len(compressed) == 21008
          assert hashlib.sha1(b"blob 21008\0" + compressed).hexdigest() == PATCH_BLOB
          decoder = lzma.LZMADecompressor(memlimit=134217728)
          patch = decoder.decompress(compressed, max_length=2000000)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest() == PATCH_HASH
          subprocess.run(["git", "checkout", "--detach", BASE], check=True)
          assert git("rev-parse", "HEAD^{tree}").decode() == BASE_TREE
          assert not git("status", "--porcelain")
          subprocess.run(["git", "apply", "--check", "--index"], input=patch, check=True)
          subprocess.run(["git", "apply", "--index"], input=patch, check=True)
          assert git("write-tree").decode() == TARGET
          paths = git("diff", "--cached", "--name-only", "-z").decode().rstrip("\0").split("\0")
          assert len(paths) == 33 and len(set(paths)) == 33
          entries = []
          for path in paths:
              assert path.startswith(("src/", "tests/"))
              assert all(p not in ("", ".", "..") for p in path.split("/"))
              mode, expected, stage_and_path = git("ls-files", "--stage", "--", path).decode().split(" ", 2)
              assert mode == "100644" and stage_and_path == "0\t" + path
              content = subprocess.check_output(["git", "show", ":" + path])
              blob = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
              assert blob == expected and len(content) < 1000000
              entries.append({"path": path, "mode": mode, "type": "blob", "content": content.decode("utf-8")})
          # Git objects only: no refs, commits, app/cloud deployments, secrets or dispatches.
          value = api("POST", "git/trees", {"base_tree": BASE_TREE, "tree": entries})
          assert value["sha"] == TARGET
          receipt = {"sourceBase": BASE, "sourceTree": TARGET, "patchSha256": PATCH_HASH,
                     "changedFiles": len(entries), "workflowCommit": head,
                     "refUpdated": False, "deployed": False}
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kova-auth-object-receipt"
          folder.mkdir()
          (folder / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY_SOURCE_OBJECTS
      - name: Preserve the exact-tree receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kova-auth-object-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/kova-auth-object-receipt/receipt.json
          if-no-files-found: error
          retention-days: 1
