name: Candidate Source Evidence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/candidate-source-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Archive tracked source and record provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/candidate-source-evidence"
          git archive --format=tar --prefix=candidate/ "$SOURCE_SHA" | gzip -n > "$RUNNER_TEMP/candidate-source-evidence/candidate-source.tar.gz"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/candidate-source-evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/candidate-source-evidence/tree.txt"
          cd "$RUNNER_TEMP/candidate-source-evidence"
          sha256sum candidate-source.tar.gz > SHA256SUMS

      - name: Upload exact-head source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/candidate-source-evidence/
          if-no-files-found: error
          retention-days: 1
