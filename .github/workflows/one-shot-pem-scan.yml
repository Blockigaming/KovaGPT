name: One-shot close PEM browser scan gap

on:
  push:
    branches:
      - infra/verified-browser-image-provenance
    paths:
      - .github/workflows/one-shot-pem-scan.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Patch PEM scanning and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/azure/verify-browser-config.mjs")
          source = verifier.read_text()
          old = '  ".mjs",\n  ".svg",'
          new = '  ".mjs",\n  ".pem",\n  ".svg",'
          if old not in source:
              raise SystemExit("expected text-extension insertion point was not found")
          verifier.write_text(source.replace(old, new, 1))

          tests = Path("tests/unit/azure-browser-config-provenance.test.mjs")
          test_source = tests.read_text()
          marker = 'test("PEM public assets are scanned before verification",'
          if marker not in test_source:
              test_source += '''\n\ntest("PEM public assets are scanned before verification", () => {\n  withBundle(\n    {\n      "client/assets/app.js": browserSource(),\n      "client/client-key.pem": "-----BEGIN PRIVATE KEY-----\\nnot-a-real-key\\n-----END PRIVATE KEY-----",\n    },\n    ({ bundleDir }) => {\n      assert.throws(() => verify(bundleDir), /private key material/u);\n    },\n  );\n});\n'''
          tests.write_text(test_source)
          PY
          rm .github/workflows/one-shot-pem-scan.yml
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write scripts/azure/verify-browser-config.mjs tests/unit/azure-browser-config-provenance.test.mjs
      - run: node --test tests/unit/azure-browser-config-provenance.test.mjs
      - run: git diff --check
      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KovaGPT release automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Scan PEM browser assets before verified promotion"
          git push origin HEAD:infra/verified-browser-image-provenance
