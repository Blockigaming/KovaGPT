name: Capture fresh database failure tail once

on:
  push:
    branches:
      - fix/fresh-db-stripe-event-timestamp-index
    paths:
      - .github/workflows/capture-fresh-db-tail-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/fresh-db-stripe-event-timestamp-index
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture sanitized final output
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run release:db:isolated > /tmp/isolated-db.log 2>&1
          STATUS=$?
          set -e
          mkdir -p docs/ci

          node - "$STATUS" <<'NODE'
          const fs = require("node:fs");
          const status = Number(process.argv[2]);
          const raw = fs.readFileSync("/tmp/isolated-db.log", "utf8");
          const sanitized = raw
            .replace(/(?:postgres(?:ql)?:\/\/)[^\s]+/gi, "$1[REDACTED]")
            .replace(/\b(?:sk|sb_secret)_[A-Za-z0-9_-]{16,}\b/g, "[REDACTED_SECRET]")
            .replace(/(password|secret|token)=([^\s]+)/gi, "$1=[REDACTED]");
          const tail = sanitized.split(/\r?\n/).slice(-160);
          const body = [
            "# Fresh database isolated-run tail",
            "",
            "Generated on the stacked draft branch using a local ephemeral Supabase instance.",
            "No hosted Supabase or Azure resource was accessed.",
            "",
            `Exit status: \`${status}\``,
            "",
            "```text",
            ...tail,
            "```",
            "",
            "Diagnostic evidence only. Do not infer a migration fix without reviewing the exact failing operation.",
            "",
          ].join("\n");
          fs.writeFileSync("docs/ci/fresh-db-isolated-tail.md", body);
          NODE

      - name: Remove this one-shot workflow
        run: rm .github/workflows/capture-fresh-db-tail-once.yml

      - name: Commit sanitized diagnostic
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Capture fresh database isolated run tail"
          git push origin HEAD:fix/fresh-db-stripe-event-timestamp-index
