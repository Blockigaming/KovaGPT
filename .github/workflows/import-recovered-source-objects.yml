name: Import Recovered Source Objects

on:
  push:
    branches: [codex/recover-unpublished-20260906]
    paths: [.github/workflows/import-recovered-source-objects.yml]

permissions: {}

jobs:
  import:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/codex/recover-unpublished-20260906'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read source ancestry without retaining checkout credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import only independently hash-verified immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/recovery/import-reviewed-objects.py)" = '411aa513a0413b3073627fe72eb0cb8b659395e6'
          # Preserve the fixed importer and add only the one verified worker
          # path omitted from its allowlist. All object/tree hashes still apply.
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/recovery/import-reviewed-objects.py').read_text()
          old = 'path in ("database-contract.json", "release-migrations.json")'
          new = 'path in ("database-contract.json", "release-migrations.json", "public/kova-sw.js")'
          assert source.count(old) == 1
          exec(compile(source.replace(old, new), 'verified-source-import', 'exec'))
          PY

      - name: Retain exact recovered manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovered-object-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/imported-source/manifest.json
          if-no-files-found: error
          retention-days: 7
