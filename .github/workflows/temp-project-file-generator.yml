name: Temporary Project file source generator

on:
  push:
    branches:
      - codex/project-file-security-20260904
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/project-file-security-20260904
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and regenerate release contracts
        run: |
          npx prettier --write \
            src/integrations/supabase/types.ts \
            src/lib/project-files-policy.mjs \
            src/lib/project-workspace.functions.ts \
            src/routeTree.gen.ts \
            src/routes/api/project-files.ts \
            'src/routes/projects.$projectId.tsx' \
            tests/integration/project-file-security-source.test.mjs \
            tests/unit/project-files-policy.test.mjs \
            release-rls-matrix.json
          npm run release:manifest
          npm run release:schema
          npx prettier --write database-contract.json release-migrations.json
          git diff --check
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/integrations/supabase/types.ts \
            src/lib/project-files-policy.mjs \
            src/lib/project-workspace.functions.ts \
            src/routeTree.gen.ts \
            src/routes/api/project-files.ts \
            'src/routes/projects.$projectId.tsx' \
            tests/integration/project-file-security-source.test.mjs \
            tests/unit/project-files-policy.test.mjs \
            release-rls-matrix.json \
            database-contract.json \
            release-migrations.json
          git commit -m "chore: format Project file security source"
          git push origin HEAD:codex/project-file-security-20260904
