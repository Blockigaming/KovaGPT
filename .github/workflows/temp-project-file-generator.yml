name: Temporary Project File Formatter

on:
  push:
    branches:
      - codex/project-file-security-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: codex/project-file-security-20260904

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format Project file changes
        run: |
          npx prettier --write \
            src/routes/api/project-files.ts \
            src/routes/projects.\$projectId.tsx \
            src/lib/project-files-policy.mjs \
            src/lib/project-files-policy.d.mts \
            src/lib/project-workspace.functions.ts \
            src/lib/projects.functions.ts \
            src/lib/chat-workspace-context.server.ts \
            src/lib/chat-workspace.functions.ts \
            src/integrations/supabase/types.ts \
            src/routeTree.gen.ts \
            tests/integration/project-file-security-source.test.mjs \
            tests/unit/project-files-policy.test.mjs \
            docs/supabase-storage-contract.md
          npm run release:manifest
          npm run release:schema
          npx prettier --write release-migrations.json database-contract.json

      - name: Commit generated changes
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/api/project-files.ts \
            src/routes/projects.\$projectId.tsx \
            src/lib/project-files-policy.mjs \
            src/lib/project-files-policy.d.mts \
            src/lib/project-workspace.functions.ts \
            src/lib/projects.functions.ts \
            src/lib/chat-workspace-context.server.ts \
            src/lib/chat-workspace.functions.ts \
            src/integrations/supabase/types.ts \
            src/routeTree.gen.ts \
            tests/integration/project-file-security-source.test.mjs \
            tests/unit/project-files-policy.test.mjs \
            docs/supabase-storage-contract.md \
            supabase/migrations/20260904200000_project_file_upload_integrity.sql \
            release-migrations.json database-contract.json
          git commit -m "chore(project-files): format and refresh release contracts"
          git push origin HEAD:codex/project-file-security-20260904
