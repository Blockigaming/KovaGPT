name: Validate KovaGPT Cloudflare production edge boundary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VALIDATE to run the non-deploying production edge checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kovagpt-cloudflare-production-validation
  cancel-in-progress: true

jobs:
  validate-only:
    if: inputs.confirmation == 'VALIDATE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate the Cloudflare edge-only architecture
        run: node --test tests/unit/cloudflare-deploy-workflow.test.mjs

      - name: Record the non-deployment boundary
        run: echo "Validation complete. Azure Container Apps remains the application origin; this workflow cannot deploy or shift traffic."
