name: Supabase recovery template one-shot repair

on:
  push:
    branches:
      - ops/supabase-recovery-template-repair-20260902
    paths:
      - .github/workflows/supabase-recovery-template-repair.yml

permissions:
  contents: read

concurrency:
  group: supabase-recovery-template-repair
  cancel-in-progress: false

jobs:
  repair:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_REF: mfbycmbjygcfkrsuepxf
      TARGET_SUBJECT: Reset your KovaGPT password
      TARGET_EMAIL: zacharylblock@gmail.com
      TARGET_REDIRECT_TO: https://kovagpt.com/reset-password
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and validate the canonical recovery template
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not available in the production environment."
            exit 2
          fi
          grep -Fq 'https://mfbycmbjygcfkrsuepxf.supabase.co' src/config/public-config.ts
          grep -Fq 'PUBLIC_BACKEND_PROJECT_ID = "mfbycmbjygcfkrsuepxf"' src/config/public-config.ts
          curl --fail --silent --show-error --location --max-time 20 \
            --output /tmp/kova-logo.png \
            'https://mfbycmbjygcfkrsuepxf.supabase.co/storage/v1/object/public/brand-assets/kova-logo.png'
          test -s /tmp/kova-logo.png

          cat > /tmp/recovery.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta name="color-scheme" content="dark">
              <meta name="supported-color-schemes" content="dark">
              <title>Reset your KovaGPT password</title>
            </head>
            <body style="margin:0;padding:0;background-color:#0a0b0d;color:#f7f7f8;font-family:Arial,Helvetica,sans-serif;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#0a0b0d" style="width:100%;background-color:#0a0b0d;">
                <tr>
                  <td align="center" style="padding:40px 16px;">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#15171c" style="width:100%;max-width:560px;background-color:#15171c;border:1px solid #2a2e36;border-radius:20px;">
                      <tr>
                        <td style="padding:32px 32px 10px;">
                          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                              <td style="vertical-align:middle;padding-right:12px;">
                                <img src="https://mfbycmbjygcfkrsuepxf.supabase.co/storage/v1/object/public/brand-assets/kova-logo.png" width="44" height="44" alt="KovaGPT" style="display:block;width:44px;height:44px;border:0;border-radius:12px;">
                              </td>
                              <td style="vertical-align:middle;color:#f7f7f8;font-size:20px;font-weight:700;letter-spacing:-0.3px;">KovaGPT</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px 32px;">
                          <h1 style="margin:0 0 16px;color:#f7f7f8;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-0.8px;">Reset your password</h1>
                          <p style="margin:0 0 24px;color:#c9ccd3;font-size:16px;line-height:1.6;">We received a request to reset the password for your KovaGPT account. Use the secure button below to choose a new password.</p>
                          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;">
                            <tr>
                              <td align="center" bgcolor="#f7f7f8" style="border-radius:12px;">
                                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#0a0b0d;font-size:16px;line-height:20px;font-weight:700;text-decoration:none;border-radius:12px;">Reset password</a>
                              </td>
                            </tr>
                          </table>
                          <p style="margin:0 0 18px;color:#8f949e;font-size:13px;line-height:1.55;">For your security, this recovery link is single-use. If the button does not open, copy and paste this URL into your browser:</p>
                          <p style="margin:0;word-break:break-all;color:#b9bec8;font-size:12px;line-height:1.55;"><a href="{{ .ConfirmationURL }}" style="color:#d7dae0;text-decoration:underline;">{{ .ConfirmationURL }}</a></p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:22px 32px 30px;border-top:1px solid #2a2e36;">
                          <p style="margin:0;color:#8f949e;font-size:13px;line-height:1.55;">If you did not request this password reset, you can safely ignore this email. Your password will not change.</p>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:18px 0 0;color:#666b75;font-size:12px;line-height:1.5;">KovaGPT · Secure account recovery</p>
                  </td>
                </tr>
              </table>
            </body>
          </html>
          HTML

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const body = fs.readFileSync('/tmp/recovery.html', 'utf8');
          const opens = (body.match(/{{/g) || []).length;
          const closes = (body.match(/}}/g) || []).length;
          if (opens !== 3 || closes !== 3) throw new Error(`unexpected template delimiter count: ${opens}/${closes}`);
          if ((body.match(/{{ \.ConfirmationURL }}/g) || []).length !== 3) throw new Error('only the supported .ConfirmationURL variable may be used');
          if (!body.includes('background-color:#0a0b0d')) throw new Error('dark background marker missing');
          if (!body.includes('/brand-assets/kova-logo.png')) throw new Error('public Kova logo marker missing');
          const sha = crypto.createHash('sha256').update(body).digest('hex');
          console.log(`TARGET_SUBJECT=${process.env.TARGET_SUBJECT}`);
          console.log(`TARGET_BODY_SHA256=${sha}`);
          console.log(`TARGET_BODY_BYTES=${Buffer.byteLength(body)}`);
          NODE

      - name: Read active Auth config, patch only recovery fields, and verify persistence
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          auth_header="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"

          curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            --header 'Accept: application/json' \
            "$endpoint" > /tmp/auth-before.json

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cfg = JSON.parse(fs.readFileSync('/tmp/auth-before.json', 'utf8'));
          const targetBody = fs.readFileSync('/tmp/recovery.html', 'utf8');
          const beforeBody = String(cfg.mailer_templates_recovery_content || '');
          const beforeSubject = String(cfg.mailer_subjects_recovery || '');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const hook = {};
          for (const [key, value] of Object.entries(cfg)) {
            if (!/hook.*send.*email|send.*email.*hook/i.test(key)) continue;
            if (/secret|token|key/i.test(key)) hook[key] = '[redacted]';
            else if (typeof value === 'string' && /^https?:\/\//i.test(value)) {
              try { const url = new URL(value); hook[key] = `${url.origin}${url.pathname}`; }
              catch { hook[key] = '[configured string]'; }
            } else hook[key] = value;
          }
          const before = {
            subject: beforeSubject,
            body: beforeBody,
            body_sha256: sha(beforeBody),
            body_bytes: Buffer.byteLength(beforeBody),
            has_dark_marker: beforeBody.includes('background-color:#0a0b0d') || beforeBody.includes('background:#0a0b0d'),
            has_logo_marker: beforeBody.includes('/brand-assets/kova-logo.png'),
            has_confirmation_url: beforeBody.includes('{{ .ConfirmationURL }}'),
            hooks: hook,
          };
          const target = {
            subject: process.env.TARGET_SUBJECT,
            body: targetBody,
            body_sha256: sha(targetBody),
            body_bytes: Buffer.byteLength(targetBody),
          };
          fs.writeFileSync('/tmp/patch.json', JSON.stringify({
            mailer_subjects_recovery: target.subject,
            mailer_templates_recovery_content: target.body,
          }));
          fs.writeFileSync('/tmp/recovery-template-evidence.json', JSON.stringify({
            project_ref: process.env.PROJECT_REF,
            captured_at: new Date().toISOString(),
            before,
            target,
          }, null, 2));
          console.log(`BEFORE_SUBJECT=${before.subject}`);
          console.log(`BEFORE_BODY_SHA256=${before.body_sha256}`);
          console.log(`BEFORE_BODY_BYTES=${before.body_bytes}`);
          console.log(`BEFORE_HAS_DARK_MARKER=${before.has_dark_marker}`);
          console.log(`BEFORE_HAS_LOGO_MARKER=${before.has_logo_marker}`);
          console.log(`BEFORE_HAS_CONFIRMATION_URL=${before.has_confirmation_url}`);
          console.log(`SEND_EMAIL_HOOK_SUMMARY=${JSON.stringify(hook)}`);
          console.log(`BEFORE_MATCHES_TARGET=${before.subject === target.subject && beforeBody === targetBody}`);
          NODE

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/patch.json \
            "$endpoint" > /tmp/auth-patch-response.json

          curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            --header 'Accept: application/json' \
            "$endpoint" > /tmp/auth-after.json

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cfg = JSON.parse(fs.readFileSync('/tmp/auth-after.json', 'utf8'));
          const body = fs.readFileSync('/tmp/recovery.html', 'utf8');
          const actualBody = String(cfg.mailer_templates_recovery_content || '');
          const actualSubject = String(cfg.mailer_subjects_recovery || '');
          if (actualSubject !== process.env.TARGET_SUBJECT) throw new Error(`subject did not persist: ${JSON.stringify(actualSubject)}`);
          if (actualBody !== body) throw new Error('recovery body did not persist byte-for-byte');
          const sha = crypto.createHash('sha256').update(actualBody).digest('hex');
          const evidence = JSON.parse(fs.readFileSync('/tmp/recovery-template-evidence.json', 'utf8'));
          evidence.after = {
            subject: actualSubject,
            body: actualBody,
            body_sha256: sha,
            body_bytes: Buffer.byteLength(actualBody),
            matches_target: true,
            verified_at: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/recovery-template-evidence.json', JSON.stringify(evidence, null, 2));
          console.log(`AFTER_SUBJECT=${actualSubject}`);
          console.log(`AFTER_BODY_SHA256=${sha}`);
          console.log(`AFTER_BODY_BYTES=${Buffer.byteLength(actualBody)}`);
          console.log('AFTER_MATCHES_TARGET=true');
          NODE

      - name: Generate one fresh production recovery email and detect immediate overwrite
        shell: bash
        run: |
          set -euo pipefail
          publishable_key="$(node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/config/public-config.ts', 'utf8');
          const match = source.match(/PUBLIC_BACKEND_KEY\s*=\s*"([^"]+)"/);
          if (!match) process.exit(2);
          process.stdout.write(match[1]);
          NODE
          )"
          test -n "$publishable_key"
          redirect_q="$(node -p 'encodeURIComponent(process.env.TARGET_REDIRECT_TO)')"
          recover_url="https://${PROJECT_REF}.supabase.co/auth/v1/recover?redirect_to=${redirect_q}"

          send_recovery() {
            curl --silent --show-error \
              --output /tmp/recovery-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "apikey: ${publishable_key}" \
              --header "Authorization: Bearer ${publishable_key}" \
              --header 'Content-Type: application/json' \
              --data "{\"email\":\"${TARGET_EMAIL}\"}" \
              "$recover_url"
          }

          status="$(send_recovery)"
          if [[ "$status" == "429" ]]; then
            echo 'Recovery endpoint requested a cooldown; waiting 45 seconds for the single retry.'
            sleep 45
            status="$(send_recovery)"
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Recovery request failed with HTTP ${status}."
            cat /tmp/recovery-response.json || true
            exit 1
          fi
          echo 'RECOVERY_HTTP=200'

          sleep 20
          endpoint="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Accept: application/json' \
            "$endpoint" > /tmp/auth-stability.json

          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('/tmp/auth-stability.json', 'utf8'));
          const targetBody = fs.readFileSync('/tmp/recovery.html', 'utf8');
          if (String(cfg.mailer_subjects_recovery || '') !== process.env.TARGET_SUBJECT) throw new Error('recovery subject was overwritten after the test send');
          if (String(cfg.mailer_templates_recovery_content || '') !== targetBody) throw new Error('recovery body was overwritten after the test send');
          const evidence = JSON.parse(fs.readFileSync('/tmp/recovery-template-evidence.json', 'utf8'));
          evidence.test = {
            requested_at: new Date(Date.now() - 20000).toISOString(),
            checked_at: new Date().toISOString(),
            recipient: process.env.TARGET_EMAIL,
            redirect_to: process.env.TARGET_REDIRECT_TO,
            recovery_http_status: 200,
            active_config_still_matches_target: true,
          };
          fs.writeFileSync('/tmp/recovery-template-evidence.json', JSON.stringify(evidence, null, 2));
          console.log('POST_SEND_CONFIG_STABLE=true');
          NODE

      - name: Upload redacted recovery-template evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supabase-recovery-template-evidence
          path: /tmp/recovery-template-evidence.json
          if-no-files-found: ignore
          retention-days: 7
