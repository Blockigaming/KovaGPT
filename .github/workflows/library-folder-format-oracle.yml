name: Library folder formatter oracle

on:
  push:
    branches:
      - codex/library-folder-ui-20260904

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/LibraryFolderOrganizer.tsx src/routes/library.tsx tests/integration/library-folder-ui-source.test.mjs
      - name: Print formatted sources
        shell: bash
        run: |
          for file in src/components/LibraryFolderOrganizer.tsx src/routes/library.tsx tests/integration/library-folder-ui-source.test.mjs; do
            echo "FORMAT_START:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
