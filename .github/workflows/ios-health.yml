name: Apple Health iOS build
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-health.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build for iPhone Simulator without signing
        run: |
          xcodebuild -project ios/KovaHealth.xcodeproj -scheme KovaHealth \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Verify the isolated staging companion build
        run: |
          xcodebuild -project ios/KovaHealth.xcodeproj -scheme KovaHealth -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/kova-health-staging" \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.kovagpt.health.staging \
            KOVA_HEALTH_STAGING_HOST=staging.kovagpt.com build
          plist="$RUNNER_TEMP/kova-health-staging/Build/Products/Debug-iphonesimulator/KovaHealth.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.kovagpt.health.staging
          test "$(/usr/libexec/PlistBuddy -c 'Print :KovaHealthStagingHost' "$plist")" = staging.kovagpt.com
