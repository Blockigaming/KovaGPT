name: Library contract formatter oracle

on:
  push:
    branches:
      - codex/library-auto-save-20260904

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print locked Prettier output
        shell: bash
        run: |
          for file in database-contract.json release-migrations.json; do
            echo "FORMAT_ORACLE_BEGIN:$file"
            npx prettier "$file" | base64 -w0
            echo
            echo "FORMAT_ORACLE_END:$file"
          done
