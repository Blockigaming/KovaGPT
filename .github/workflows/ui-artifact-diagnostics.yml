name: Verify PR 578 search keeps the sidebar preference

on:
  push:
    branches: [qa/ui-diagnostics-578-20261105]

permissions:
  contents: read

jobs:
  search:
    name: Search state (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      KOVA_INTERFACE_ENGINE: ${{ matrix.browser }}
      AI_GENERATION_ENABLED: "false"
      KOVA_GENERATION_DISABLED: "true"
    steps:
      - name: Checkout exact reviewed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9e60217db724b91c4cacb51fadacafeb4970ef41
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          for item in json.loads(base64.b64decode("")):
              pathlib.Path(item["path"]).write_text(item["content"])
          PY
          npx --no-install prettier --write tests/unit/command-palette-interaction.test.mjs tests/unit/spec400-library-trash-navigation.test.mjs tests/e2e/sidebar-touch-selection.spec.ts .github/workflows/interface-fit-audit.yml
          cat > playwright.search-review.config.ts <<'EOF'
          import base from "./playwright.interface-fit.config";
          import { defineConfig } from "@playwright/test";
          const engine = process.env.KOVA_INTERFACE_ENGINE;
          export default defineConfig({ ...base, testDir: "./tests/e2e", testMatch: "sidebar-touch-selection.spec.ts",
          outputDir: `test-results/search-review/${engine}/screenshots`,
          reporter: [["list"], ["json", { outputFile: `test-results/search-review/${engine}/results.json` }]], });
          EOF
      - name: Build the application before the search fix
        run: npm run build:azure
      - name: Install browser and signed native libraries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          npx --no-install playwright install --with-deps "${{ matrix.browser }}"
      - name: Prove both closed-sidebar regressions before the fix
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --no-install playwright test --config=playwright.search-review.config.ts --project="${{ matrix.browser }}-390" --grep="dark: (search action keeps|management search preserves).*closed"
          baseline_status=$?
          set -e
          test "$baseline_status" -ne 0
          python3 - <<'PY'
          import json, os, pathlib
          result = pathlib.Path("test-results/search-review") / os.environ["KOVA_INTERFACE_ENGINE"] / "results.json"
          data = json.loads(result.read_text())
          assert data["stats"]["unexpected"] == 2, data["stats"]
          assert "toBeVisible" in json.dumps(data), "Expected missing search dialogs to fail"
          result.rename(result.with_name("before-search-fix.json"))
          PY
      - name: Apply search fixes and check focused runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          for item in json.loads(base64.b64decode("")):
              pathlib.Path(item["path"]).write_text(item["content"])
          PY
          npx --no-install prettier --write src/components/CommandPalette.tsx src/components/Sidebar.tsx
          npx --no-install eslint src/components/CommandPalette.tsx src/components/Sidebar.tsx tests/e2e/sidebar-touch-selection.spec.ts
          npm run typecheck
          node --test tests/unit/command-palette-interaction.test.mjs tests/unit/spec400-library-trash-navigation.test.mjs tests/unit/sidebar-tablet-menu-contract.test.mjs tests/unit/sidebar-modern-identity-runtime.test.mjs tests/unit/sidebar-primary-rail-runtime.test.mjs
          python3 - <<'PY'
          import base64, json, pathlib
          for name in ["src/components/CommandPalette.tsx","src/components/Sidebar.tsx","tests/unit/command-palette-interaction.test.mjs","tests/unit/spec400-library-trash-navigation.test.mjs","tests/e2e/sidebar-touch-selection.spec.ts",".github/workflows/interface-fit-audit.yml"]:
              print("SOURCE_BEGIN:" + json.dumps({"path": name}))
              encoded = base64.b64encode(pathlib.Path(name).read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 4096):
                  print("SOURCE_CHUNK:" + encoded[index:index + 4096])
              print("SOURCE_END")
          PY
      - name: Build full production artifacts for integration checks
        if: matrix.browser == 'chromium'
        run: npm run build
      - name: Keep all integration checks strict
        if: matrix.browser == 'chromium'
        run: npm run test:integration
      - name: Build the fixed Node application
        run: npm run build:azure
      - name: Repeat every search and swipe regression in all nine sizes
        run: npx --no-install playwright test --config=playwright.search-review.config.ts --repeat-each=2
      - name: Record source and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/search-review
          git rev-parse HEAD > test-results/search-review/base-commit.txt
          git diff --binary > test-results/search-review/candidate.patch
          sha256sum package-lock.json > test-results/search-review/lock.sha256
      - name: Retain exact results and failed-case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: search-state-${{ matrix.browser }}-9e60217
          path: test-results/search-review/
          if-no-files-found: error
          retention-days: 7
