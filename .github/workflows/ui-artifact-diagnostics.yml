name: Inspect current PR 578 UI screenshots

on:
  push:
    branches: [qa/ui-diagnostics-578-20261105]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the verified candidate screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: "13453325906,13451803602"
          run-id: "42106199124"
          github-token: ${{ github.token }}
          path: screenshots
      - name: Export selected synthetic screenshots for visual inspection
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import pathlib

          root = pathlib.Path("screenshots")
          for path in root.rglob("commit.txt"):
              assert path.read_text().strip() == "8607e61497ac434349c88e217c084f335237056c"
          scenes = {"dark--.png", "light--.png", "dark--library.png",
                    "dark--settings-appearance.png", "light--settings-appearance.png",
                    "response-actions.png", "chat-loading.png"}
          for path in sorted(root.rglob("*.png")):
              name = str(path)
              wanted = any(size in name for size in
                  ("chromium-320", "chromium-390", "chromium-landscape", "chromium-1440", "webkit-320"))
              if not wanted or path.name not in scenes:
                  continue
              print("SHOT_BEGIN:" + json.dumps({"path": name}))
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 4096):
                  print("SHOT_CHUNK:" + encoded[index:index + 4096])
              print("SHOT_END")
          PY
