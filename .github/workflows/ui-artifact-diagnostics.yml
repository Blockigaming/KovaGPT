name: Verify PR 578 focus integration contract

on:
  push:
    branches: [qa/ui-diagnostics-578-20261105]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: a8fa9adc9605365d8232c54d4c2030a4c483f2b5
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update the contract without relaxing the focus requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          item = json.loads(base64.b64decode(""))
          pathlib.Path(item["path"]).write_text(item["content"])
          PY
          npx --no-install prettier --write tests/integration/mobile-shell-ui-truth.test.mjs
          npx --no-install eslint tests/integration/mobile-shell-ui-truth.test.mjs
          python3 - <<'PY'
          import json, pathlib
          name = "tests/integration/mobile-shell-ui-truth.test.mjs"
          print("SOURCE_JSON:" + json.dumps({"path": name, "content": pathlib.Path(name).read_text()}))
          PY
      - name: Run the entire integration suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration | tee integration-review.log
          python3 - <<'PY'
          import pathlib, re
          log = re.sub(r"\x1b\[[0-9;]*m", "", pathlib.Path("integration-review.log").read_text())
          totals = {name: int(re.search(r"^ℹ " + name + r" (\d+)$", log, re.M).group(1)) for name in ["tests", "pass", "fail", "skipped"]}
          assert totals["tests"] >= 568 and totals["pass"] == totals["tests"], totals
          assert totals["fail"] == 0 and totals["skipped"] == 0, totals
          print(totals)
          PY
      - name: Save integration proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: focus-integration-a8fa9ad
          path: |
            integration-review.log
            tests/integration/mobile-shell-ui-truth.test.mjs
          if-no-files-found: error
          retention-days: 7
