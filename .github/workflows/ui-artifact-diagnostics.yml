name: Verify current PR 578 sidebar gestures

on:
  push:
    branches: [qa/ui-diagnostics-578-20261105]

permissions:
  contents: read

jobs:
  gesture:
    name: Sidebar gestures (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      KOVA_INTERFACE_ENGINE: ${{ matrix.browser }}
      AI_GENERATION_ENABLED: "false"
      KOVA_GENERATION_DISABLED: "true"
    steps:
      - name: Checkout the exact PR source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 215281610115cbd8a21fc7cbeeb33155248ce508
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare portable event fixtures and deterministic focus regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          for item in json.loads(base64.b64decode("")):
              pathlib.Path(item["path"]).write_text(item["content"])
          PY
          npx --no-install prettier --write tests/e2e/sidebar-touch-selection.spec.ts playwright.interface-fit.config.ts .github/workflows/interface-fit-audit.yml
      - name: Build the actual Node application
        run: npm run build:azure
      - name: Install browser and native libraries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          npx --no-install playwright install --with-deps "${{ matrix.browser }}"
      - name: Test selection and modal interruption in all nine sizes three times
        shell: bash
        run: |
          set -euo pipefail
          cat > playwright.sidebar-review.config.ts <<'EOF'
          import base from "./playwright.interface-fit.config";
          import { defineConfig } from "@playwright/test";
          const engine = process.env.KOVA_INTERFACE_ENGINE;
          export default defineConfig({
            ...base,
            testDir: "./tests/e2e",
            testMatch: "sidebar-touch-selection.spec.ts",
            outputDir: `test-results/sidebar-review/${engine}/screenshots`,
            reporter: [["list"], ["json", { outputFile: `test-results/sidebar-review/${engine}/results.json` }]],
          });
          EOF
          set +e
          npx --no-install playwright test --config=playwright.sidebar-review.config.ts --project="${{ matrix.browser }}-320" --grep="search takes keyboard focus before"
          baseline_status=$?
          set -e
          test "$baseline_status" -ne 0
          python3 - <<'PY'
          import json, os, pathlib
          result = pathlib.Path("test-results/sidebar-review") / os.environ["KOVA_INTERFACE_ENGINE"] / "results.json"
          data = json.loads(result.read_text())
          assert data["stats"]["unexpected"] == 1, data["stats"]
          assert "toBeFocused" in json.dumps(data), "Expected the immediate-focus assertion to fail"
          result.rename(result.with_name("before-focus-fix.json"))
          PY
      - name: Apply the focus fix and validate the existing keyboard behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          for item in json.loads(base64.b64decode("")):
              pathlib.Path(item["path"]).write_text(item["content"])
          PY
          npx --no-install prettier --write src/components/CommandPalette.tsx tests/unit/command-palette-interaction.test.mjs
          npx --no-install eslint src/components/CommandPalette.tsx tests/e2e/sidebar-touch-selection.spec.ts playwright.interface-fit.config.ts
          node --test tests/unit/command-palette-interaction.test.mjs
          python3 - <<'PY'
          import json, pathlib
          for name in ["tests/e2e/sidebar-touch-selection.spec.ts","playwright.interface-fit.config.ts",".github/workflows/interface-fit-audit.yml","src/components/CommandPalette.tsx","tests/unit/command-palette-interaction.test.mjs"]:
              print("SOURCE_JSON:" + json.dumps({"path": name, "content": pathlib.Path(name).read_text()}))
          PY
      - name: Rebuild with the focus fix
        run: npm run build:azure
      - name: Verify fixed focus, selection, and modal interruption repeatedly in all sizes
        run: npx --no-install playwright test --config=playwright.sidebar-review.config.ts --repeat-each=3
      - name: Record exact source and test configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "215281610115cbd8a21fc7cbeeb33155248ce508"
          mkdir -p test-results/sidebar-review
          git rev-parse HEAD > test-results/sidebar-review/commit.txt
          git rev-parse 'HEAD^{tree}' > test-results/sidebar-review/tree.txt
          sha256sum package-lock.json > test-results/sidebar-review/lock.sha256
          if [[ -f playwright.sidebar-review.config.ts ]]; then
            cp playwright.sidebar-review.config.ts test-results/sidebar-review/
          fi
      - name: Save exact results and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidebar-gestures-${{ matrix.browser }}-focus-2152816
          path: test-results/sidebar-review/
          if-no-files-found: error
          retention-days: 7
