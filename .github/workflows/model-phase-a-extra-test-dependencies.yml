name: Model Phase A extra test dependencies only

on:
  push:
    branches: [diag/model-phase-a-extra-deps-20260916]

permissions:
  contents: read

jobs:
  dependencies:
    if: github.repository == 'Blockigaming/KovaGPT' && github.ref == 'refs/heads/diag/model-phase-a-extra-deps-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture isolated CPU test tools and public changelog
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/model-phase-a-extra-dependencies"
          mkdir -p "$evidence/node24"
          cp "$(command -v node)" "$evidence/node24/node"
          node --version > "$evidence/node-version.txt"
          tar -czf "$evidence/node24.tar.gz" -C "$evidence" node24
          rm -rf "$evidence/node24"
          PIP_CONFIG_FILE=/dev/null PIP_EXTRA_INDEX_URL='' python3 -m pip download --index-url https://pypi.org/simple --disable-pip-version-check --no-deps --only-binary=:all: --dest "$evidence" psycopg==3.3.5
          curl --fail --silent --show-error --max-time 20 https://supabase.com/changelog.md > "$evidence/supabase-changelog.md"
          cd "$evidence"
          sha256sum node24.tar.gz psycopg-3.3.5-py3-none-any.whl supabase-changelog.md > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-phase-a-extra-test-dependencies
          path: ${{ runner.temp }}/model-phase-a-extra-dependencies/
          if-no-files-found: error
          retention-days: 1
