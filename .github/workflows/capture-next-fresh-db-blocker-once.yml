name: Capture next fresh database blocker once

on:
  push:
    branches:
      - fix/fresh-db-stripe-event-timestamp-index
    paths:
      - .github/workflows/capture-next-fresh-db-blocker-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/fresh-db-stripe-event-timestamp-index
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run isolated database and capture sanitized result
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs/ci
          set +e
          npm run release:db:isolated > /tmp/isolated-db.log 2>&1
          STATUS=$?
          set -e

          node - "$STATUS" <<'NODE'
          const fs = require("node:fs");
          const status = Number(process.argv[2]);
          const raw = fs.readFileSync("/tmp/isolated-db.log", "utf8");
          const lines = raw.split(/\r?\n/);
          const interesting = lines.filter((line) =>
            /(?:failed to apply migration|ERROR:|SQLSTATE|relation .* does not exist|column .* does not exist|function .* does not exist|constraint .* does not exist|duplicate key|violates .* constraint|toomanyrequests|rate limit)/i.test(line),
          );
          const applied = lines
            .filter((line) => /Applying migration /i.test(line))
            .slice(-8)
            .map((line) => line.replace(/^.*Applying migration /i, "Applying migration "));
          const safe = [...applied, ...interesting.slice(-24)]
            .map((line) => line.replace(/(?:postgres(?:ql)?:\/\/)[^\s]+/gi, "$1[REDACTED]"))
            .map((line) => line.replace(/\b(?:sk|sb_secret)_[A-Za-z0-9_-]{16,}\b/g, "[REDACTED_SECRET]"));
          const body = [
            "# Fresh database next-blocker diagnostic",
            "",
            "Generated by the isolated local Supabase workflow on the stacked draft branch.",
            "No hosted Supabase or Azure resource was accessed.",
            "",
            `Exit status: \`${status}\``,
            "",
            "```text",
            ...(safe.length ? safe : ["No matching SQL or registry failure line was emitted."]),
            "```",
            "",
            "This file is diagnostic evidence only and does not authorize a migration edit or deployment.",
            "",
          ].join("\n");
          fs.writeFileSync("docs/ci/fresh-db-next-blocker.md", body);
          NODE

      - name: Remove this one-shot workflow
        run: rm .github/workflows/capture-next-fresh-db-blocker-once.yml

      - name: Commit sanitized diagnostic
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Capture next fresh database migration blocker"
          git push origin HEAD:fix/fresh-db-stripe-event-timestamp-index
