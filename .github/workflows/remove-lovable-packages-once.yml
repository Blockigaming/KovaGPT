name: Remove Lovable packages once

on:
  push:
    branches:
      - program/azure-gpt56-foundation
    paths:
      - .github/workflows/remove-lovable-packages-once.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: program/azure-gpt56-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove Lovable packages and regenerate lockfile
        run: >-
          npm uninstall
          @lovable.dev/email-js
          @lovable.dev/webhooks-js
          --ignore-scripts
          --no-audit
          --no-fund

      - name: Verify deterministic install and absence
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if grep -R --line-number --fixed-strings '@lovable.dev/' package.json package-lock.json; then
            echo "Lovable package reference remains in package metadata." >&2
            exit 1
          fi

      - name: Remove this one-shot workflow
        run: rm .github/workflows/remove-lovable-packages-once.yml

      - name: Commit deterministic package removal
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Remove Lovable package dependencies"
          git push origin HEAD:program/azure-gpt56-foundation
