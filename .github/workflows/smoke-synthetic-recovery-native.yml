name: Smoke isolated recovery on native tools without credentials

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/smoke-synthetic-recovery-native.yml
      - .github/workflows/capture-managed-auth-production.yml
      - scripts/release/**
      - tests/unit/test_synthetic_recovery_native.py
      - tests/unit/test_generic_operator_archive_native.py
      - tests/unit/test_operator_oci_runtime_binding.py
      - tests/unit/test_private_capture_memory.py
      - tests/unit/test_prepare_recovery_operator_image.py
      - tests/unit/synthetic-recovery-native-workflow.test.mjs

permissions:
  contents: read

concurrency:
  group: synthetic-recovery-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-capture-memory:
    if: github.event_name == 'pull_request' && github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check capture memory rejection boundaries without credentials
        run: python3 -m unittest discover -s tests/unit -p test_private_capture_memory.py -q
      - name: Prepare actual run-owned no-swap memory without source access
        run: python3 scripts/release/private-capture-memory.py prepare
      - name: Prove Python temporary files and a data-free file roundtrip use this mount
        run: python3 scripts/release/private-capture-memory.py verify
      - name: Exercise actual capture encryption and decryption with synthetic bytes only
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, tempfile
          source = pathlib.Path('scripts/release/managed-auth-recovery.py')
          spec = importlib.util.spec_from_file_location('capture_memory_crypto_smoke', source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory(prefix='data-free-capture-crypto-') as directory:
              root = pathlib.Path(directory)
              plain, encrypted, restored = [root / name for name in ['synthetic.txt', 'synthetic.gpg', 'roundtrip.txt']]
              plain.write_bytes(b'KOVA_DATA_FREE_CAPTURE_MEMORY_CRYPTO_PROBE\n')
              phrase = b'KOVA_SYNTHETIC_ONLY_NOT_A_PRODUCTION_PASSPHRASE'
              module.crypt(os.environ, phrase, plain, encrypted)
              module.crypt(os.environ, phrase, encrypted, restored, decrypt=True)
              assert plain.read_bytes() == restored.read_bytes()
          print(json.dumps({'dataFreeCaptureCryptoRoundtripVerified': True, 'sourceConnected': False, 'customerRowsUsed': False, 'protectedPhraseUsed': False}))
          PY
      - name: Require exact run-owned memory cleanup
        if: always()
        run: python3 scripts/release/private-capture-memory.py cleanup

  native-synthetic:
    if: github.event_name == 'pull_request' && github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KOVA_SYNTHETIC_NATIVE_CONFIRMATION: SYNTHETIC_ONLY
      KOVA_SYNTHETIC_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check rejection, logging and private runtime recipes without Docker
        run: |
          python3 -m unittest discover -s tests/unit -p test_synthetic_recovery_native.py -q
          python3 -m unittest discover -s tests/unit -p test_prepare_recovery_operator_image.py -q
          python3 -m unittest discover -s tests/unit -p test_extension_relation_payloads.py -q
          python3 -m unittest discover -s tests/unit -p test_extension_semantic_capture.py -q
          python3 -m unittest discover -s tests/unit -p test_owned_noswap_volumes.py -q
          python3 -m unittest discover -s tests/unit -p test_noswap_volume_proof.py -q
          python3 -m unittest discover -s tests/unit -p test_verified_server_image.py -q
      - name: Build generic client locally and prove empty native targets and denied routes
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          python3 scripts/release/smoke-synthetic-recovery-native.py --execute
          --output "$RUNNER_TEMP/kova-synthetic-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/receipt.json"
      - name: Reconcile only this run's owned containers, network and generic image
        if: always()
        run: python3 scripts/release/smoke-synthetic-recovery-native.py --cleanup-only
      - name: Retain fixed synthetic hashes and counts only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-recovery-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kova-synthetic-proof-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: warn
          retention-days: 7

  native-oci-archive:
    if: github.event_name == 'pull_request' && github.repository == 'Blockigaming/KovaGPT'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KOVA_SYNTHETIC_NATIVE_CONFIRMATION: SYNTHETIC_ONLY
      KOVA_SYNTHETIC_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check native archive context, conversion and rejection contracts
        run: |
          python3 -m unittest discover -s tests/unit -p test_generic_operator_archive_native.py -q
          python3 -m unittest discover -s tests/unit -p test_operator_oci_runtime_binding.py -q
          python3 -m unittest discover -s tests/unit -p test_prepare_recovery_operator_image.py -q
          python3 -m unittest discover -s tests/unit -p test_extension_relation_payloads.py -q
          python3 -m unittest discover -s tests/unit -p test_extension_semantic_capture.py -q
      - name: Select signed distro OCI transport before all private inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Rehearse the final generic producer, OCI load and native tools without credentials
        run: >-
          timeout --signal=TERM --kill-after=30s 23m
          python3 scripts/release/smoke-generic-operator-archive-native.py --execute
          --output "$RUNNER_TEMP/kova-native-oci-archive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/receipt.json"
      - name: Reconcile only this archive rehearsal's owned generic images and private memory
        if: always()
        run: python3 scripts/release/smoke-generic-operator-archive-native.py --cleanup-only
      - name: Retain only the native archive rehearsal hashes and counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-oci-roundtrip-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kova-native-oci-archive-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: warn
          retention-days: 7
