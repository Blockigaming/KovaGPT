name: PR 390 source formatting repair
on:
  push:
    branches: [codex/issue-208-production-evidence]
    paths: [.github/workflows/pr390-format-repair-once.yml]
permissions:
  contents: write
jobs:
  repair-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the inspected collector source
        run: git diff --exit-code 262124471a0622c0485b5c41b23d1bacd3e1e444 HEAD -- scripts/release/zero-lovable-production.mjs tests/unit/zero-lovable-production-evidence.test.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only the two reported source files and run collector regressions
        run: |
          ./node_modules/.bin/prettier --write scripts/release/zero-lovable-production.mjs tests/unit/zero-lovable-production-evidence.test.mjs
          ./node_modules/.bin/prettier --check scripts/release/zero-lovable-production.mjs tests/unit/zero-lovable-production-evidence.test.mjs
          node --test tests/unit/zero-lovable-production-evidence.test.mjs
          git diff --check
      - name: Create a verified source candidate without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          allowed = {'scripts/release/zero-lovable-production.mjs', 'tests/unit/zero-lovable-production-evidence.test.mjs'}
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed and set(changed) <= allowed, 'unexpected source changes'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          def post(endpoint, payload):
              request = urllib.request.Request(
                  'https://api.github.com/repos/Blockigaming/KovaGPT/' + endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(p).read_text()} for p in sorted(changed)]
          for p in ['.github/workflows/pr390-source-once.yml', '.github/workflows/pr390-format-repair-once.yml']:
              if pathlib.Path(p).is_file():
                  entries.append({'path': p, 'mode': '100644', 'type': 'blob', 'sha': None})
          result = post('git/trees', {'base_tree': tree, 'tree': entries})
          commit = post('git/commits', {
              'message': 'style(collector): fix exact-head formatting and remove temporary workflows',
              'tree': result['sha'], 'parents': [head],
          })
          print('REPAIR_CANDIDATE_SHA=' + commit['sha'])
          print('Source-only candidate; temporary workflows removed; no branch moved.')
          PY
