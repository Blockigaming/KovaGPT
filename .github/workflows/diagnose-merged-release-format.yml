name: Diagnose merged-release formatting
on:
  pull_request:
    paths:
      - .github/workflows/diagnose-merged-release-format.yml
permissions:
  contents: read
jobs:
  exact-prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/components/ChatMessage.tsx tests/unit/composer-voice-dialog-runtime.test.mjs
          git diff -- src/components/ChatMessage.tsx tests/unit/composer-voice-dialog-runtime.test.mjs
