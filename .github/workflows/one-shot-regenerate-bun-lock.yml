name: One-shot regenerate supported Bun lockfile

on:
  push:
    branches:
      - fix/production-supabase-retarget-preflight

permissions:
  contents: write

concurrency:
  group: one-shot-regenerate-bun-lock
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/production-supabase-retarget-preflight
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Regenerate lockfile without installing packages
        run: bun install --lockfile-only --ignore-scripts

      - name: Verify the supported Bun resolution
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'nanoid@3.3.16' bun.lock; then
            echo '::error::bun.lock still contains nanoid@3.3.16'
            exit 1
          fi
          if ! grep -Fq 'nanoid@3.3.18' bun.lock; then
            echo '::error::bun.lock does not contain nanoid@3.3.18'
            exit 1
          fi
          git diff --exit-code -- package.json package-lock.json
          changed_lines="$(git diff --numstat -- bun.lock | awk '{ total += $1 + $2 } END { print total + 0 }')"
          if (( changed_lines > 3000 )); then
            echo "::error::Bun lock regeneration changed ${changed_lines} lines; manual review is required."
            exit 1
          fi
          bun install --frozen-lockfile --lockfile-only --ignore-scripts
          git diff --check

      - name: Commit regenerated lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-regenerate-bun-lock.yml
          git add bun.lock
          git diff --cached --check
          git config user.name 'KovaGPT release automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Regenerate the supported Bun lockfile'
          git push origin HEAD:fix/production-supabase-retarget-preflight
