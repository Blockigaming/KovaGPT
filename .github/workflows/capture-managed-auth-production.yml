name: Capture complete production managed Auth database only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CAPTURE_ONLY; no restore, migration, deployment or email
        required: true
        type: string
      source_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      approved_database_build:
        description: Current independently observed production database build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-managed-auth-capture
  cancel-in-progress: false

jobs:
  capture-only:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'CAPTURE_ONLY' && inputs.source_sha == github.sha && inputs.approved_database_build == '17.6.1.155'
    runs-on: ubuntu-24.04
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select PostgreSQL 17 clients and require GPG
        shell: bash
        run: |
          set -euo pipefail
          pg17_dir=/usr/lib/postgresql/17/bin
          select_pg17() {
            if [[ -x "$pg17_dir/psql" && -x "$pg17_dir/pg_dump" && -x "$pg17_dir/pg_restore" ]]; then
              export PATH="$pg17_dir:$PATH"
            fi
          }
          require_pg17() {
            local program version expected
            for program in psql pg_dump pg_restore; do
              version="$("$program" --version)" || return 1
              expected="^${program} \\(PostgreSQL\\) 17\\."
              [[ "$version" =~ $expected ]] || return 1
            done
          }
          pg17_candidate() {
            local line
            while IFS= read -r line; do
              if [[ "$line" =~ ^[[:space:]]*Candidate:[[:space:]]+([^[:space:]]+) ]]; then
                printf '%s\n' "${BASH_REMATCH[1]}"
                return
              fi
            done < <(apt-cache policy postgresql-client-17)
          }
          select_pg17
          if ! require_pg17; then
            sudo apt-get update
            candidate="$(pg17_candidate)"
            if [[ -z "$candidate" || "$candidate" == '(none)' ]]; then
              # Official PostgreSQL Ubuntu instructions; explicit noble/amd64,
              # scoped Signed-By key, full fingerprint and normal APT signatures.
              . /etc/os-release
              [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "$VERSION_CODENAME" == noble ]]
              [[ "$(dpkg --print-architecture)" == amd64 ]]
              command -v curl >/dev/null
              command -v gpg >/dev/null
              pg17_key_dir="$(mktemp -d)"
              trap 'python3 -c "import shutil,sys;shutil.rmtree(sys.argv[1])" "$pg17_key_dir"' EXIT
              curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
                https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$pg17_key_dir/key.asc"
              fingerprints=()
              while IFS=: read -r kind f2 f3 f4 f5 f6 f7 f8 f9 fingerprint rest; do
                if [[ "$kind" == fpr ]]; then fingerprints+=("$fingerprint"); fi
              done < <(gpg --batch --show-keys --with-colons "$pg17_key_dir/key.asc")
              [[ "${#fingerprints[@]}" == 1 && "${fingerprints[0]}" == B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 ]]
              sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
              sudo install -m 0644 "$pg17_key_dir/key.asc" /usr/share/postgresql-common/pgdg/kova-pgdg.asc
              printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
                'Suites: noble-pgdg' 'Architectures: amd64' 'Components: main' \
                'Signed-By: /usr/share/postgresql-common/pgdg/kova-pgdg.asc' > "$pg17_key_dir/pgdg.sources"
              sudo install -m 0644 "$pg17_key_dir/pgdg.sources" /etc/apt/sources.list.d/kova-pgdg.sources
              sudo apt-get update
              candidate="$(pg17_candidate)"
            fi
            [[ "$candidate" =~ ^17\.[0-9A-Za-z.+:~_-]+$ ]]
            sudo apt-get install --yes --no-install-recommends "postgresql-client-17=$candidate"
            select_pg17
            require_pg17
          fi
          if [[ -x "$pg17_dir/psql" && -x "$pg17_dir/pg_dump" && -x "$pg17_dir/pg_restore" ]]; then
            printf '%s\n' "$pg17_dir" >> "$GITHUB_PATH"
          fi
          for program in psql pg_dump pg_restore; do
            "$program" --version
          done
          command -v gpg >/dev/null
          command -v timeout >/dev/null
      - name: Capture one consistent complete database snapshot into ciphertext
        env:
          KOVA_AUTH_RECOVERY_CONFIRMATION: CAPTURE_ONLY
          KOVA_APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          KOVA_AUTH_APPROVED_SOURCE_DATABASE_VERSION: ${{ inputs.approved_database_build }}
          KOVA_PRODUCTION_DATABASE_URL: ${{ secrets.KOVA_PRODUCTION_DATABASE_URL }}
          KOVA_PRODUCTION_BACKUP_PASSPHRASE: ${{ secrets.KOVA_PRODUCTION_BACKUP_PASSPHRASE_20260926 }}
        run: timeout --signal=TERM --kill-after=10s 26m python3 scripts/release/managed-auth-recovery.py capture --execute --output "$RUNNER_TEMP/managed-auth-capture"
      - name: Retain ciphertext and fixed sanitized receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-auth-capture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/managed-auth-capture/managed-auth-backup.tar.gpg
            ${{ runner.temp }}/managed-auth-capture/capture-receipt.json
          if-no-files-found: error
          retention-days: 7
