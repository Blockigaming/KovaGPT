name: Temporary iPad and iOS build verification
on:
  push:
    branches: [codex/device-qa-ios-744]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile the native device app and widget
        run: |
          xcodebuild -project ios/KovaChat.xcodeproj -scheme KovaChat \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/kova-device" \
            CODE_SIGNING_ALLOWED=NO -quiet build
          app="$RUNNER_TEMP/kova-device/Build/Products/Debug-iphoneos/KovaChat.app"
          test -d "$app/PlugIns/KovaChatWidgets.appex"
          xcrun vtool -show-build "$app/KovaChat" | tee "$RUNNER_TEMP/kova-platform.txt"
          grep -Eq 'platform[[:space:]]+IOS$' "$RUNNER_TEMP/kova-platform.txt"
      - name: Build the native simulator binaries
        run: |
          xcodebuild -project ios/KovaChat.xcodeproj -scheme KovaChat \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/kova-ios" \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Install and launch on iPad simulator with maximum Dynamic Type
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/kova-simulators.json"
          device="$(python3 - "$RUNNER_TEMP/kova-simulators.json" <<'PY'
          import json, sys
          runtimes = json.load(open(sys.argv[1]))["devices"]
          for name in reversed(sorted(runtimes)):
              for device in runtimes[name]:
                  if name.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and device["name"].startswith("iPad"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No iPad simulator is installed")
          PY
          )"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$device" content_size
          xcrun simctl install "$device" "$RUNNER_TEMP/kova-ios/Build/Products/Debug-iphonesimulator/KovaChat.app"
          xcrun simctl launch "$device" com.kovagpt.chat
          xcrun simctl get_app_container "$device" com.kovagpt.chat app
