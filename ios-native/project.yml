name: KovaGPT
options:
  bundleIdPrefix: com.kovagpt
  deploymentTarget:
    iOS: "16.0"
targets:
  KovaGPT:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: KovaGPT
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Use the camera only after you choose Scan or Camera."
        UIRequiresFullScreen: false
    dependencies:
      - target: KovaGPTShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovagpt.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO

  KovaGPTShortcuts:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: KovaGPT Shortcuts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovagpt.ios.shortcuts
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
